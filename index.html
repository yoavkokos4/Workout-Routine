<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Training Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training Log">
<meta name="theme-color" content="#ECEDE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101315" media="(prefers-color-scheme: dark)">
<meta name="description" content="A minimal, personal workout tracker — log sets, plan training days, and follow your progress over time.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap');

:root {
  color-scheme: light dark;
  --display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --sans: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --bg: #ECEDE9;
  --surface: #F8F8F5;
  --surface-2: #DEE0DA;
  --border: #CBCEC6;
  --text: #14181A;
  --dim: #566062;
  --faint: #868F8F;
  --accent: #14181A;
  --accent-ink: #F3F4F0;
  --pr: #0F7F57;
  --push: #D93A2D;
  --pull: #1F63C9;
  --mix: #E5A200;
  --push-ink: #B52A1F;
  --pull-ink: #174FA3;
  --mix-ink: #85600A;
  --lift: 0 10px 28px rgba(20, 24, 26, 0.16);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101315;
    --surface: #181C1F;
    --surface-2: #232A2D;
    --border: #2F373B;
    --text: #ECEFEA;
    --dim: #9AA4A5;
    --faint: #687375;
    --accent: #ECEFEA;
    --accent-ink: #101315;
    --pr: #3DD598;
    --push: #FF5B4D;
    --pull: #5B9BFF;
    --mix: #FFC93C;
    --push-ink: #FF7C70;
    --pull-ink: #86B3FF;
    --mix-ink: #FFC93C;
    --lift: 0 10px 28px rgba(0, 0, 0, 0.5);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); overscroll-behavior-y: none; }
body {
  font-family: var(--sans);
  font-size: 15px;
  color: var(--text);
  min-height: 100vh;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
button, input { font-family: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-top: env(safe-area-inset-top); }
.wt-loading { display: flex; align-items: center; justify-content: center; height: 100vh; gap: 10px; color: var(--dim); }
.wt-spinner { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
svg { display: block; }

.wt-screen { padding: 30px 20px 116px; flex: 1; }
.wt-eyebrow { font-size: 13px; font-weight: 600; color: var(--dim); margin-bottom: 6px; }
.wt-display { font-family: var(--display); font-weight: 800; font-size: 48px; line-height: 1; margin: 0 0 12px; letter-spacing: 0.005em; }
.wt-title { font-family: var(--display); font-weight: 800; font-size: 42px; line-height: 1; margin: 0; letter-spacing: 0.005em; }
.wt-date { font-size: 13.5px; font-weight: 500; color: var(--dim); margin-top: 6px; }
.wt-h2 { font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1.05; margin: 0; letter-spacing: 0.01em; }
.wt-subtle { color: var(--dim); font-size: 14.5px; font-weight: 500; line-height: 1.55; margin: 0 0 26px; }
.wt-mono { font-variant-numeric: tabular-nums; font-weight: 600; }
.wt-dim { color: var(--dim); }

/* ---- transitions & press states ---- */
@keyframes wtFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.wt-enter { animation: wtFadeUp .32s cubic-bezier(.16,.8,.3,1); }

.wt-cta, .wt-option, .wt-add-set-btn, .wt-icon-btn, .wt-icon-btn-quiet, .wt-quick-add-chip, .wt-filter-chip, .wt-nav-btn, .wt-color-dot, .wt-check-row, .wt-fail-toggle, .wt-next, .wt-raise {
  transition: transform .12s ease, background-color .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease;
}
.wt-cta:active, .wt-option:active, .wt-add-set-btn:active, .wt-quick-add-chip:active, .wt-filter-chip:active, .wt-check-row:active, .wt-fail-toggle:active, .wt-next:active, button.wt-raise:active { transform: scale(.97); }
.wt-icon-btn:active, .wt-icon-btn-quiet:active, .wt-nav-btn:active, .wt-color-dot:active { transform: scale(.88); }

@keyframes wtChipPop { 0% { transform: scale(.7); opacity: 0; } 65% { transform: scale(1.07); opacity: 1; } 100% { transform: scale(1); } }
.wt-chip-pop { animation: wtChipPop .32s cubic-bezier(.34,1.56,.64,1); }

@keyframes wtPrPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(15,127,87,0); } 50% { box-shadow: 0 0 0 6px rgba(15,127,87,.22); } }
.wt-chip-pr-new { animation: wtPrPulse 1.2s ease-out 1; }

@keyframes wtCheckPop { from { transform: scale(0); } to { transform: scale(1); } }
.wt-checkbox-checked svg { animation: wtCheckPop .22s cubic-bezier(.34,1.56,.64,1); }

@keyframes wtToastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* ---- progress ring, drawn like a weight plate ---- */
.wt-ring-block { display: flex; align-items: center; gap: 22px; margin: 24px 0 28px; }
.wt-ring-wrap { position: relative; width: 104px; height: 104px; flex-shrink: 0; }
.wt-ring-fg { transition: stroke-dashoffset .85s cubic-bezier(.16,.8,.3,1); }
.wt-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.wt-ring-num { font-family: var(--display); font-size: 40px; font-weight: 800; line-height: .9; }
.wt-ring-denom { font-size: 12px; font-weight: 600; color: var(--dim); margin-top: 3px; }
.wt-ring-caption { font-size: 14px; font-weight: 500; color: var(--dim); line-height: 1.5; }
.wt-ring-caption b { color: var(--text); font-weight: 700; }

/* ---- week strip ---- */
.wt-week { display: flex; justify-content: space-between; margin: 4px 0 28px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
.wt-week-col { display: flex; flex-direction: column; align-items: center; gap: 9px; }
.wt-week-letter { font-size: 12px; font-weight: 600; color: var(--faint); position: relative; padding-bottom: 6px; }
.wt-week-letter-today { color: var(--text); }
.wt-week-letter-today::after { content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 12px; height: 2px; border-radius: 1px; background: var(--accent); }
.wt-week-dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; }

.wt-cta { width: 100%; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 14px; min-height: 56px; padding: 0 18px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; margin: 4px 0 26px; }
.wt-cta:disabled { background: var(--surface-2); color: var(--faint); }
.wt-cta-finish { position: sticky; bottom: 88px; box-shadow: var(--lift); }
.wt-cta-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }

.wt-section-title { font-size: 14px; font-weight: 700; color: var(--text); margin: 34px 0 10px; }

/* ---- flat list rows (Home / History / Templates) ---- */
.wt-list { margin-bottom: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 0 16px; }
.wt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 0; border-bottom: 1px solid var(--border); }
.wt-row:last-child { border-bottom: none; }
.wt-row-tag { width: 4px; align-self: stretch; border-radius: 2px; margin-inline-end: 11px; flex-shrink: 0; }
.wt-row-main { flex: 1; min-width: 0; }
.wt-row-title { font-size: 15.5px; font-weight: 600; }
.wt-row-meta { color: var(--dim); font-size: 13px; font-weight: 500; margin-top: 3px; line-height: 1.45; }
.wt-row-value { font-size: 12.5px; font-weight: 600; color: var(--dim); white-space: nowrap; }
.wt-row-btn { width: 100%; background: none; border: none; padding: 0; text-align: left; color: inherit; display: flex; align-items: center; cursor: pointer; }
.wt-history-detail { padding: 4px 0 14px; display: flex; flex-direction: column; gap: 14px; }
.wt-history-exercise-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.wt-confirm-text { font-size: 12px; color: var(--push-ink); margin: 4px 0 12px; font-weight: 600; }

/* ---- exercise card during workout ---- */
.wt-exblock { background: var(--surface); border: 1px solid var(--border); border-left: 5px solid var(--block-color, var(--border)); border-radius: 16px; padding: 16px 16px 14px; margin-bottom: 12px; }
.wt-exblock-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.wt-exblock-title { font-size: 17px; font-weight: 700; line-height: 1.25; }
.wt-target { font-size: 13px; font-weight: 500; color: var(--dim); margin-top: 3px; }

.wt-raise { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 12px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--pr); background: transparent; background: color-mix(in srgb, var(--pr) 12%, transparent); color: var(--text); font-size: 13.5px; font-weight: 600; line-height: 1.35; text-align: left; }
.wt-raise svg { color: var(--pr); flex-shrink: 0; }
button.wt-raise { cursor: pointer; }

.wt-last-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-top: 12px; }
.wt-last-label { font-size: 12.5px; font-weight: 600; color: var(--dim); }

.wt-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.wt-last-row .wt-chip-row { margin: 0; }
.wt-chip { background: var(--surface-2); border: 1.5px solid transparent; border-radius: 10px; padding: 5px 10px; display: inline-flex; align-items: baseline; gap: 4px; color: var(--text); cursor: pointer; transition: box-shadow .15s ease, border-color .15s ease; }
.wt-chip-w { font-family: var(--display); font-size: 21px; font-weight: 800; line-height: 1; }
.wt-chip-u { font-size: 12.5px; font-weight: 600; color: var(--dim); }
.wt-chip svg { align-self: center; }
.wt-chip-fail { display: inline-flex; align-self: center; color: var(--push-ink); margin-inline-start: 2px; }
.wt-chip-pr { border-color: var(--pr); color: var(--pr); background: transparent; }
.wt-chip-pr .wt-chip-u { color: var(--pr); }
.wt-chip-editing { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.wt-chip-ghost { background: transparent; border: 1px dashed var(--border); padding: 3px 8px; cursor: default; }
.wt-chip-ghost .wt-chip-w { font-size: 17px; color: var(--dim); }
.wt-chip-ghost .wt-chip-u { font-size: 12px; }
.wt-chip-x { background: none; border: none; color: var(--faint); cursor: pointer; display: inline-flex; padding: 0 0 0 2px; align-self: center; }

.wt-set-form { display: flex; gap: 6px; margin-top: 10px; }
.wt-input { flex: 1; background: var(--surface-2); border: 1.5px solid transparent; color: var(--text); border-radius: 12px; padding: 12px 12px; font-size: 16px; min-width: 0; }
.wt-input::-webkit-outer-spin-button, .wt-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.wt-input::placeholder { color: var(--faint); font-weight: 500; }
.wt-input-num { -moz-appearance: textfield; text-align: center; font-size: 20px; font-weight: 700; padding: 10px 6px; }
.wt-input-tiny { flex: 1; padding: 9px 6px; font-size: 14px; text-align: center; }
.wt-add-set-btn { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 12px; padding: 0 16px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.wt-fail-toggle { background: transparent; color: var(--dim); border: 1.5px solid var(--border); border-radius: 12px; padding: 0 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 11px; font-weight: 700; cursor: pointer; min-width: 50px; }
.wt-fail-toggle.on { background: var(--push); border-color: var(--push); color: #fff; }
.wt-hint-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; min-height: 26px; }
.wt-next { background: none; border: 1px solid var(--border); border-radius: 20px; padding: 4px 11px; font-size: 12.5px; font-weight: 600; color: var(--text); cursor: pointer; }
.wt-best-hint { font-size: 12.5px; font-weight: 600; color: var(--faint); margin-inline-start: auto; }
.wt-duplicate-btn { margin-top: 6px; background: none; border: none; color: var(--dim); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 0; }

.wt-quick-add-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.wt-quick-add-chip { background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 20px; padding: 7px 13px; font-size: 13px; font-weight: 500; cursor: pointer; }

.wt-tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.wt-tag { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 13px; font-weight: 500; color: var(--dim); cursor: pointer; transition: transform .12s ease, border-color .15s ease, color .15s ease; }
.wt-tag:active { transform: scale(.96); }

.wt-add-exercise { border-top: 1px dashed var(--border); padding-top: 18px; margin-top: 18px; }
.wt-add-exercise-label { font-size: 14px; font-weight: 700; margin-bottom: 8px; }

.wt-row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 12px; }
.wt-icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.wt-icon-btn-quiet { width: 34px; height: 34px; border-radius: 50%; border: none; background: transparent; color: var(--dim); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.wt-icon-btn-quiet:disabled { opacity: .3; cursor: default; }
.wt-emoji-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0; }

.wt-option { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; color: var(--text); padding: 16px; margin-bottom: 9px; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; cursor: pointer; text-align: left; }
.wt-option-tag { width: 4px; align-self: stretch; border-radius: 2px; }

.wt-color-row { display: flex; gap: 12px; margin-bottom: 24px; }
.wt-color-dot { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer; padding: 0; }
.wt-color-dot-active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }

.wt-checklist { display: flex; flex-direction: column; margin-bottom: 18px; border-top: 1px solid var(--border); }
.wt-check-block { border-bottom: 1px solid var(--border); }
.wt-check-row { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: none; padding: 13px 2px; color: var(--text); font-size: 15px; font-weight: 500; cursor: pointer; text-align: left; }
.wt-checkbox { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border); display: inline-flex; align-items: center; justify-content: center; color: var(--accent-ink); flex-shrink: 0; }
.wt-checkbox-checked { border-color: var(--accent); background: var(--accent); }
.wt-target-inputs { display: flex; gap: 6px; padding: 0 2px 14px; }

.wt-links-row { display: flex; gap: 20px; margin-top: 36px; flex-wrap: wrap; }
.wt-text-link { background: none; border: none; color: var(--dim); font-size: 13px; font-weight: 500; cursor: pointer; padding: 0 0 1px; border-bottom: 1px solid var(--faint); }

.wt-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--border); display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); }
.wt-nav-btn { flex: 1; background: none; border: none; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 0; cursor: pointer; }
.wt-nav-active { color: var(--text); }
.wt-nav-icon { position: relative; display: flex; align-items: center; justify-content: center; width: 54px; height: 30px; border-radius: 15px; transition: background-color .2s ease, color .2s ease; }
.wt-nav-active .wt-nav-icon { background: var(--accent); color: var(--accent-ink); }
.wt-nav-dot { position: absolute; top: 3px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--push); box-shadow: 0 0 0 2px var(--bg); }

.wt-toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 11px 20px; border-radius: 24px; font-size: 14px; font-weight: 600; z-index: 20; box-shadow: var(--lift); white-space: nowrap; animation: wtToastIn .28s cubic-bezier(.16,.8,.3,1); }

/* ---- stat tiles & charts (Trends) ---- */
.wt-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 0 26px; }
.wt-stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 16px 14px; }
.wt-stat-value { font-family: var(--display); font-weight: 800; font-size: 40px; line-height: .95; margin-bottom: 6px; }
.wt-stat-label { font-size: 13px; font-weight: 500; color: var(--dim); }

.wt-chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 16px 16px; margin-bottom: 22px; }
.wt-chart-title-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; gap: 10px; }
.wt-chart-title { font-size: 15px; font-weight: 700; }
.wt-chart-sub { font-size: 12.5px; font-weight: 500; color: var(--dim); white-space: nowrap; }
.wt-chart-svg-wrap { width: 100%; }

/* ---- filters (History) ---- */
.wt-filter-row { display: flex; gap: 7px; flex-wrap: wrap; margin: 0 0 16px; }
.wt-filter-chip { border: 1px solid var(--border); background: transparent; color: var(--dim); border-radius: 20px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
.wt-filter-chip-active { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.wt-segmented { display: flex; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.wt-segmented button { flex: 1; background: none; border: none; border-inline-end: 1px solid var(--border); color: var(--dim); font-size: 13px; font-weight: 600; padding: 11px 4px; cursor: pointer; transition: background-color .15s ease, color .15s ease; }
.wt-segmented button:last-child { border-inline-end: none; }
.wt-segmented button.active { background: var(--accent); color: var(--accent-ink); }

/* ---- reorder rows (Template editor) ---- */
.wt-reorder-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--border); }
.wt-reorder-emoji { font-size: 16px; flex-shrink: 0; }
.wt-reorder-name { flex: 1; font-size: 14.5px; font-weight: 500; min-width: 0; }
.wt-reorder-btns { display: flex; gap: 2px; }

/* ---- history table ---- */
.wt-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
.wt-table th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--dim); padding: 0 8px 10px 0; border-bottom: 1px solid var(--border); }
.wt-table td { padding: 14px 8px 14px 0; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 500; vertical-align: middle; }
.wt-table tr.wt-table-row { cursor: pointer; transition: background-color .15s ease; }
.wt-table tr.wt-table-row:active { background: var(--surface-2); }
.wt-table-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
.wt-table-detail-row td { padding: 0 0 14px; border-bottom: 1px solid var(--border); }

/* ---- empty states ---- */
.wt-empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 46px 14px; color: var(--dim); gap: 16px; }
.wt-empty svg { opacity: .45; }
.wt-empty p { font-size: 14px; margin: 0; line-height: 1.6; max-width: 270px; }
.wt-empty-title { font-weight: 700; color: var(--text); margin-bottom: 4px !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="import-file-input" accept="application/json" style="display:none">
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "workout-app-data-v1";

      var y = pad + (1 - (values[i] - min) / (max - min)) * (h - pad * 2);
      pts.push([x, y]);
    }
    var line = pts.map(function (p) { return p[0].toFixed(2) + "," + p[1].toFixed(2); }).join(" ");
    var dots = pts.map(function (p, i) {
      var big = i === n - 1;
      return '<line x1="' + p[0].toFixed(2) + '" y1="' + p[1].toFixed(2) + '" x2="' + p[0].toFixed(2) + '" y2="' + p[1].toFixed(2) + '" stroke="' + color + '" stroke-width="' + (big ? 7 : 4) + '" stroke-linecap="round" vector-effect="non-scaling-stroke"></line>';
    }).join("");
    return '<div class="wt-chart-svg-wrap"><svg viewBox="0 0 100 ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' +
      '<polyline points="' + line + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>' + dots + '</svg></div>';
  }
  function emptyState(title, sub) {
    return '<div class="wt-empty">' + ICON.emptyDoodle + '<div><p class="wt-empty-title">' + esc(title) + '</p><p>' + esc(sub) + '</p></div></div>';
  }

  // ---------- screens ----------
  function renderHome() {
    var last = data.sessions[data.sessions.length - 1];
    var hour = new Date().getHours();
    var greeting = (hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening") + " " + (hour < 12 ? "☀️" : hour < 18 ? "👋" : "🌙");

    var streak = computeStreak();

    var recent = data.sessions.slice(-4).reverse().map(function (s) {

        '<div class="wt-row-meta">' + s.entries.length + ' exercises, ' + sessionSetCount(s) + ' sets</div></div>' +

      '<div class="wt-ring-block">' + ring(weekSets, goalSets, "var(--accent)") +
      '<div><div class="wt-ring-caption">You\'ve logged <b>' + weekSets + ' of ' + goalSets + ' sets</b> this week' + (weekSessions.length ? ' across <b>' + weekSessions.length + '</b> session' + (weekSessions.length > 1 ? 's' : '') : '') + '.</div>' +
      (streak > 0 ? '<div class="wt-ring-caption" style="margin-top:9px;display:flex;align-items:center;gap:6px;color:var(--accent)">' + ICON.flame + '<span style="color:var(--text);font-weight:600">' + streak + '</span>&nbsp;week streak</div>' : '') +
      '<button class="wt-text-link" style="margin-top:11px" data-action="go-view" data-arg="goals">Edit weekly goal</button>' +
      '</div></div>' +
      weekStripHtml() +
      '<button class="wt-cta" data-action="go-start-workout">' + ICON.workout + ' Start Workout</button>' +
      (data.sessions.length ? '<div class="wt-section-title">Recent</div><div class="wt-list">' + recent + '</div>' : '') +
      '<div class="wt-links-row">' +
      '<button class="wt-text-link" data-action="export-data">Export backup</button>' +
      '<button class="wt-text-link" data-action="import-data">Import backup</button>' +

      '</div>' +
      '</div>';

      '<div class="wt-row-between"><h2 class="wt-h2">Weekly Goal</h2><button class="wt-icon-btn" data-action="go-view" data-arg="home">' + ICON.close + '</button></div>' +
      '<p class="wt-subtle">Set a weekly target and track it from the ring on Home.</p>' +

      '<input class="wt-input" type="number" inputmode="numeric" id="goal-sessions-input" value="' + data.goals.sessions + '">' +
      '<div class="wt-section-title">Sets per week</div>' +

      '<button class="wt-option" data-action="start-draft" data-arg="freestyle"><span>' + emojiFor("Freestyle") + ' Freestyle</span><span class="wt-dim">' + ICON.plus + '</span></button>' +
      opts +

  function renderWorkout() {
    var draft = data.draft;
    var usedNames = {};
    draft.entries.forEach(function (e) { usedNames[e.exerciseName] = true; });
    var available = data.exercises.filter(function (n) { return !usedNames[n]; });
    var totalSets = sessionSetCount(draft);
    var totalTarget = draft.entries.reduce(function (sum, e) { return sum + (e.target ? e.target.sets : 0); }, 0);
    var badgeColor = draft.dayColor ? DAY_COLORS[draft.dayColor] : "var(--accent)";
    var badgeInk = draft.dayColor ? DAY_INK[draft.dayColor] : "var(--text)";

    var ringBlock = '<div class="wt-ring-block">' + ring(totalSets, totalTarget, badgeColor) +
      '<div class="wt-ring-caption">' + (totalTarget > 0
        ? '<b>' + totalSets + ' of ' + totalTarget + '</b> planned sets logged.'
        : (totalSets > 0 ? '<b>' + totalSets + '</b> sets logged so far.' : 'No sets logged yet.')) + '</div></div>';

    var blocks = draft.entries.map(function (entry, idx) {
      var t = targetText(entry);
      var best = bestWeightFor(entry.exerciseName);
      var prev = lastEntryFor(entry.exerciseName);
      var raise = raiseInfo(entry, prev);
      var doneTop = topOfRange(entry.sets, entry.target);
      var suggested = nextSetWeight(entry, prev);
      var editingSI = null;
      if (editingSet) {
        var parts = editingSet.split(":");
        if (+parts[0] === idx) editingSI = +parts[1];
      }
      var isEditingHere = editingSI !== null;
      var wVal = isEditingHere ? fmtKg(entry.sets[editingSI].weight) : (suggested ? fmtKg(suggested) : "");
      var rVal = isEditingHere ? entry.sets[editingSI].reps : "";
      var blockColor = draft.dayColor ? DAY_COLORS[draft.dayColor] : "var(--border)";
      var failOn = !!failFlags[idx];

      var raiseBanner = (raise && !entry.sets.length && !isEditingHere)
        ? '<button class="wt-raise" data-action="use-weight" data-arg="' + idx + ':' + raise.weight + '">' + ICON.up +
          '<span>You hit ' + raise.reps + ' reps on every set last time. Try ' + fmtKg(raise.weight) + ' kg today.</span></button>'
        : '';
      var topNote = (doneTop && !isEditingHere)
        ? '<div class="wt-raise">' + ICON.up + '<span>Top of the range on every set. Go heavier next time.</span></div>'
        : '';
      var lastRow = prev
        ? '<div class="wt-last-row"><span class="wt-last-label">Last time, ' + esc(daysAgoText(prev.date).toLowerCase()) + '</span>' + chipsHtml(idx, prev.sets, true, null, true) + '</div>'
        : '';
      var nextChip = (suggested && entry.sets.length && !isEditingHere)
        ? '<button class="wt-next" data-action="use-weight" data-arg="' + idx + ':' + suggested + '">Next set ' + fmtKg(suggested) + ' kg</button>'
        : '<span></span>';

      return '<div class="wt-exblock" style="--block-color:' + blockColor + '">' +
        '<div class="wt-exblock-head"><div><div class="wt-exblock-title">' + emojiFor(entry.exerciseName) + ' ' + esc(entry.exerciseName) + '</div>' +
        (t ? '<div class="wt-target">' + esc(t) + '</div>' : '') + '</div>' +
        '<button class="wt-icon-btn-quiet" data-action="remove-exercise" data-arg="' + idx + '" aria-label="Remove exercise">' + ICON.trash + '</button></div>' +
        raiseBanner + lastRow + topNote +
        (entry.sets.length ? chipsHtml(idx, entry.sets, false, editingSI) : '') +
        '<div class="wt-set-form">' +
        '<input class="wt-input wt-input-num" type="number" inputmode="decimal" placeholder="kg" id="w-input-' + idx + '"' + (wVal !== "" ? ' value="' + wVal + '"' : '') + '>' +
        '<input class="wt-input wt-input-num" type="number" inputmode="numeric" placeholder="reps" id="r-input-' + idx + '"' + (isEditingHere ? ' value="' + rVal + '"' : '') + '>' +
        '<button class="wt-fail-toggle' + (failOn ? ' on' : '') + '" data-action="toggle-fail" data-arg="' + idx + '" aria-pressed="' + failOn + '" aria-label="Set was to failure">' + ICON.bolt + '<span>Fail</span></button>' +
        '<button class="wt-add-set-btn" data-action="' + (isEditingHere ? "update-set" : "add-set") + '" data-arg="' + (isEditingHere ? idx + ":" + editingSI : idx) + '">' + ICON.plus + (isEditingHere ? ' Update' : ' Add') + '</button>' +
        '</div>' +
        '<div class="wt-hint-row">' + nextChip + (best > 0 ? '<span class="wt-best-hint">Best ' + fmtKg(best) + ' kg</span>' : '') + '</div>' +
        (isEditingHere ? '<button class="wt-text-link" style="margin-top:8px" data-action="cancel-edit-set">Cancel edit</button>' : '') +
        (!isEditingHere && entry.sets.length ? '<button class="wt-duplicate-btn" data-action="duplicate-set" data-arg="' + idx + '">' + ICON.repeat + ' Repeat last set</button>' : '') +
        '</div>';
    }).join("");
    lastAddedChip = null;

    var quickChips = available.slice(0, 6).map(function (n) {
      return '<button class="wt-quick-add-chip" data-action="quick-add-exercise" data-arg="' + esc(n) + '">' + esc(n) + '</button>';
    }).join("");

    return '<div class="wt-screen">' +
      '<div class="wt-row-between"><div><h2 class="wt-title" style="color:' + badgeInk + '">' + emojiFor(draft.templateName || "Freestyle") + ' ' + esc(draft.templateName || "Freestyle") +
      '</h2><div class="wt-date">' + formatDateLong(draft.date) + '</div></div>' +
      '<button class="wt-icon-btn" data-action="cancel-workout" aria-label="Cancel workout">' + ICON.close + '</button></div>' +
      ringBlock + blocks +
      '<div class="wt-add-exercise"><div class="wt-add-exercise-label">Add exercise</div>' +
      '<div class="wt-set-form"><input class="wt-input" list="exercise-options" placeholder="Exercise name" id="new-exercise-input">' +
      '<datalist id="exercise-options">' + available.map(function (n) { return '<option value="' + esc(n) + '">'; }).join("") + '</datalist>' +
      '<button class="wt-add-set-btn" data-action="add-exercise">' + ICON.plus + ' Add</button></div>' +
      (available.length ? '<div class="wt-quick-add-row">' + quickChips + '</div>' : '') +
      '</div>' +
      '<button class="wt-cta wt-cta-finish"' + (totalSets === 0 ? " disabled" : "") + ' data-action="finish-workout">' + ICON.check + ' Finish Workout</button>' +
      '</div>';
  }

  function renderHistory() {
    var all = data.sessions.slice().reverse();
    if (!all.length) {
      return '<div class="wt-screen"><h2 class="wt-h2">History</h2>' + emptyState("No sessions yet", "Everything you finish will show up here.") + '</div>';
    }

    var filtered = all.filter(function (s) {
      if (historyColorFilter) {
        var tag = s.dayColor || "freestyle";
        if (tag !== historyColorFilter) return false;
      }
      if (historyRange !== "all") {
        var days = historyRange === "month" ? 31 : 92;
        var diff = (new Date() - new Date(s.date)) / 86400000;
        if (diff > days) return false;
      }
      if (historySearch.trim()) {
        var q = historySearch.trim().toLowerCase();
        var matchTemplate = (s.templateName || "freestyle").toLowerCase().indexOf(q) !== -1;
        var matchExercise = s.entries.some(function (e) { return e.exerciseName.toLowerCase().indexOf(q) !== -1; });
        if (!matchTemplate && !matchExercise) return false;
      }
      return true;
    });

    var colorOptions = [{ key: null, label: "All" }]
      .concat(data.templates.map(function (t) { return { key: t.color, label: t.name }; }))
      .concat([{ key: "freestyle", label: "Freestyle" }]);
    var seen = {};
    colorOptions = colorOptions.filter(function (o) {
      var k = o.key === null ? "null" : o.key;
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    });
    var chipRow = '<div class="wt-filter-row">' + colorOptions.map(function (o) {
      return '<button class="wt-filter-chip' + (historyColorFilter === o.key ? " wt-filter-chip-active" : "") + '" data-action="set-history-color" data-arg="' + (o.key === null ? "" : o.key) + '">' + esc(o.label) + '</button>';
    }).join("") + '</div>';

    var rangeSeg = '<div class="wt-segmented">' + [["all", "All time"], ["month", "This month"], ["3m", "3 months"]].map(function (r) {
      return '<button class="' + (historyRange === r[0] ? "active" : "") + '" data-action="set-history-range" data-arg="' + r[0] + '">' + r[1] + '</button>';
    }).join("") + '</div>';

    var searchInput = '<input class="wt-input" placeholder="Search exercises or plans" id="history-search-input" value="' + esc(historySearch) + '" style="margin-bottom:16px">';

    var summary = filtered.length
      ? '<p class="wt-subtle" style="margin:0 0 16px">' + filtered.length + ' session' + (filtered.length !== 1 ? "s" : "") + ', ' +
        filtered.reduce(function (sum, s) { return sum + sessionSetCount(s); }, 0) + ' sets</p>'
      : '';

    var tableHtml;
    if (!filtered.length) {
      tableHtml = '<p class="wt-subtle" style="padding:18px 0">No sessions match these filters.</p>';
    } else {
      var rows = filtered.map(function (s) {
        var open = historyOpenId === s.id;
        var planLabel = s.templateName || "Freestyle";
        var tagStyle = s.dayColor ? "background:" + DAY_COLORS[s.dayColor] : "background:var(--border)";
        var detailRow = open ? '<tr class="wt-table-detail-row"><td colspan="3"><div class="wt-history-detail">' + s.entries.map(function (e) {
          return '<div><div class="wt-history-exercise-name">' + emojiFor(e.exerciseName) + ' ' + esc(e.exerciseName) + '</div>' + chipsHtml(0, e.sets, true) + '</div>';
        }).join("") + '</div></td></tr>' : '';
        return '<tr class="wt-table-row" data-action="toggle-history" data-arg="' + s.id + '">' +
          '<td><span class="wt-table-dot" style="' + tagStyle + '"></span>' + formatDateShort(s.date) + '</td>' +
          '<td>' + emojiFor(planLabel) + ' ' + esc(planLabel) + '</td>' +
          '<td class="wt-mono">' + sessionSetCount(s) + '</td>' +
          '</tr>' + detailRow;
      }).join("");
      tableHtml = '<table class="wt-table"><thead><tr><th>Date</th><th>Plan</th><th>Sets</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    return '<div class="wt-screen"><h2 class="wt-h2">History</h2>' +
      '<div style="margin-top:20px">' + rangeSeg + chipRow + searchInput + summary + '</div>' +
      tableHtml + '</div>';
  }

  function renderTrends() {
    if (!data.sessions.length) {
      return '<div class="wt-screen"><h2 class="wt-h2">Trends</h2>' + emptyState("No data yet", "Finish a workout to start seeing progress and trends here.") + '</div>';
    }
    var month = monthStats();
    var streak = computeStreak();
    var weeks = last12WeeksSets();
    var mostTrained = mostTrainedExercises(8);
    if (progressExercise === null || mostTrained.indexOf(progressExercise) === -1) progressExercise = mostTrained[0] || null;
    var series = progressExercise ? exerciseSeries(progressExercise) : [];
    var prs = prTimeline(8);

    var statTiles = '<div class="wt-stat-grid">' +
      statTile(month.sessions, "Sessions this month") +
      statTile(month.sets, "Sets this month") +
      statTile(month.prs, "Personal bests this month") +
      statTile(streak + (streak === 1 ? " week" : " weeks"), "Current streak") +
      '</div>';

    var volumeChart = '<div class="wt-chart-card"><div class="wt-chart-title-row"><span class="wt-chart-title">Sets per week</span><span class="wt-chart-sub">Last 12 weeks</span></div>' +
      barChartSvg(weeks, { height: 64, color: "var(--accent)" }) + '</div>';

    var exercisePicker = mostTrained.length ? '<div class="wt-quick-add-row" style="margin-bottom:14px">' + mostTrained.map(function (n) {
      return '<button class="wt-filter-chip' + (n === progressExercise ? " wt-filter-chip-active" : "") + '" data-action="set-progress-exercise" data-arg="' + esc(n) + '">' + emojiFor(n) + ' ' + esc(n) + '</button>';
    }).join("") + '</div>' : '';

    var exChart = "";
    if (progressExercise) {
      if (series.length > 1) {
        var first = series[0].weight, latest = series[series.length - 1].weight;
        exChart = '<div class="wt-chart-card"><div class="wt-chart-title-row"><span class="wt-chart-title">' + emojiFor(progressExercise) + ' ' + esc(progressExercise) + '</span><span class="wt-chart-sub">best set weight</span></div>' +
          lineChartSvg(series.map(function (p) { return p.weight; }), { height: 72, color: "var(--accent)" }) +
          '<div class="wt-target" style="margin-top:10px">' + first + 'kg → ' + latest + 'kg over ' + series.length + ' sessions</div></div>';
      } else if (series.length === 1) {
        exChart = '<p class="wt-subtle">Log "' + esc(progressExercise) + '" a couple more times to see a trend.</p>';
      }
    }

    var prRows = prs.length ? '<div class="wt-list">' + prs.map(function (p) {
      return '<div class="wt-row"><span class="wt-row-tag" style="background:var(--pr)"></span>' +
        '<div class="wt-row-main"><div class="wt-row-title">' + emojiFor(p.exerciseName) + ' ' + esc(p.exerciseName) + '</div><div class="wt-row-meta">' + p.weight + 'kg × ' + p.reps + '</div></div>' +
        '<span class="wt-row-value">' + daysAgoText(p.date) + '</span></div>';
    }).join("") + '</div>' : '<p class="wt-subtle">No personal bests logged yet.</p>';

    return '<div class="wt-screen"><h2 class="wt-h2">Trends</h2>' +
      statTiles + volumeChart +
      '<div class="wt-section-title">Exercise progress</div>' + exercisePicker + exChart +
      '<div class="wt-section-title">Recent PRs</div>' + prRows +
      '</div>';
  }

  function renderTemplates() {
    if (editingTemplate !== undefined) return renderTemplateEditor();
    var items = data.templates.map(function (t) {
      var tagStyle = t.color ? "background:" + DAY_COLORS[t.color] : "background:var(--border)";

        '<button class="wt-icon-btn-quiet" data-action="delete-template" data-arg="' + t.id + '" style="' + (deleteArmedId === t.id ? "color:var(--push)" : "") + '">' + ICON.trash + '</button></div></div>';

      '<div class="wt-list">' + items + '</div>' +
      '<div class="wt-section-title">Exercise library</div><p class="wt-subtle" style="margin-bottom:12px">Tap an exercise to give it its own emoji.</p><div class="wt-tag-row">' + tags + '</div>' +
      '<div class="wt-section-title">Weight steps</div><p class="wt-subtle" style="margin-bottom:12px">The smallest jump between weights at your gym. Suggested weights are rounded to it.</p>' +
      '<div class="wt-segmented">' + [1, 2, 2.5, 5].map(function (v) {
        return '<button class="' + (weightStep() === v ? "active" : "") + '" data-action="set-step" data-arg="' + v + '">' + v + ' kg</button>';
      }).join("") + '</div></div>';

  function renderTemplateEditor() {
    var checklist = data.exercises.map(function (n) {
      var row = templateRows[n];
      var checked = row && row.checked;
      var inputs = checked ? '<div class="wt-target-inputs">' +
        '<input class="wt-input wt-input-tiny" type="number" placeholder="Sets" value="' + (row.targetSets || "") + '" data-name="' + esc(n) + '" data-field="targetSets">' +
        '<input class="wt-input wt-input-tiny" type="number" placeholder="Min reps" value="' + (row.repMin || "") + '" data-name="' + esc(n) + '" data-field="repMin">' +
        '<input class="wt-input wt-input-tiny" type="number" placeholder="Max reps" value="' + (row.repMax || "") + '" data-name="' + esc(n) + '" data-field="repMax">' +
        '</div>' : '';
      return '<div class="wt-check-block">' +
        '<div style="display:flex;align-items:center;gap:2px">' +
        '<button class="wt-emoji-btn" data-action="edit-emoji" data-arg="' + esc(n) + '" title="Tap to change the emoji">' + emojiFor(n) + '</button>' +
        '<button class="wt-check-row" style="flex:1" data-action="toggle-template-exercise" data-arg="' + esc(n) + '">' +
        '<span class="wt-checkbox' + (checked ? " wt-checkbox-checked" : "") + '">' + (checked ? ICON.check : "") + '</span>' + esc(n) + '</button>' +
        '</div>' + inputs + '</div>';
    }).join("");

    var orderSection = "";
    if (templateOrder.length > 1) {
      orderSection = '<div class="wt-section-title">Order</div><p class="wt-subtle" style="margin-bottom:10px">This is the order exercises will show up in during the workout.</p><div class="wt-checklist" style="margin-bottom:26px">' +
        templateOrder.map(function (n, i) {
          return '<div class="wt-reorder-row">' +
            '<span class="wt-reorder-emoji">' + emojiFor(n) + '</span>' +
            '<span class="wt-reorder-name">' + esc(n) + '</span>' +
            '<div class="wt-reorder-btns">' +
            '<button class="wt-icon-btn-quiet"' + (i === 0 ? " disabled" : "") + ' data-action="move-template-exercise" data-arg="' + i + ':up">' + ICON.chevUp.replace('width="15" height="15"', 'width="13" height="13"') + '</button>' +
            '<button class="wt-icon-btn-quiet"' + (i === templateOrder.length - 1 ? " disabled" : "") + ' data-action="move-template-exercise" data-arg="' + i + ':down">' + ICON.chevDown.replace('width="15" height="15"', 'width="13" height="13"') + '</button>' +
            '</div></div>';
        }).join("") +
        '</div>';
    }

    var colorDots = '<button class="wt-color-dot' + (templateColor === null ? " wt-color-dot-active" : "") +
      '" style="background:var(--surface-2)" data-action="set-template-color" data-arg="none"></button>' +
      Object.keys(DAY_COLORS).map(function (key) {
        return '<button class="wt-color-dot' + (templateColor === key ? " wt-color-dot-active" : "") + '" style="background:' + DAY_COLORS[key] + '" data-action="set-template-color" data-arg="' + key + '"></button>';
      }).join("");

    return '<div class="wt-screen">' +
      '<div class="wt-row-between"><h2 class="wt-h2">' + (editingTemplate ? "Edit Plan" : "New Plan") + '</h2>' +
      '<button class="wt-icon-btn" data-action="cancel-template-edit">' + ICON.close + '</button></div>' +
      '<input class="wt-input" placeholder="Plan name" id="template-name-input" value="' + esc(templateName) + '">' +
      '<div class="wt-section-title">Color tag</div><div class="wt-color-row">' + colorDots + '</div>' +
      '<div class="wt-section-title">Exercises</div><div class="wt-checklist">' + checklist + '</div>' +
      '<div class="wt-set-form"><input class="wt-input" placeholder="New exercise" id="new-template-exercise-input">' +
      '<button class="wt-add-set-btn" data-action="add-template-exercise">' + ICON.plus + ' Add</button></div>' +
      orderSection +
      '<button class="wt-cta" style="margin-top:26px" data-action="save-template">Save Plan</button>' +
      '</div>';
  }

  function renderNav() {
    var items = [
      { key: "home", label: "Home", icon: ICON.home },
      { key: "workout", label: "Workout", icon: ICON.workout },
      { key: "trends", label: "Trends", icon: ICON.trend },
      { key: "history", label: "History", icon: ICON.history },
      { key: "templates", label: "Plans", icon: ICON.plans }
    ];
    return '<div class="wt-nav">' + items.map(function (it) {
      var active = view === it.key;
      var dot = it.key === "workout" && data.draft ? '<span class="wt-nav-dot"></span>' : "";
      return '<button class="wt-nav-btn' + (active ? " wt-nav-active" : "") + '" data-action="go-view" data-arg="' + it.key + '">' +
        '<span class="wt-nav-icon">' + it.icon + dot + '</span><span>' + it.label + '</span></button>';
    }).join("") + '</div>';
  }

  // ---------- main render ----------
  function render() {
    var doAnim = animateNextRender;
    animateNextRender = false;
    var html = "";
    if (view === "home") html = renderHome();
    else if (view === "goals") html = renderGoals();
    else if (view === "workout") html = data.draft ? renderWorkout() : renderStartChoice();
    else if (view === "trends") html = renderTrends();
    else if (view === "history") html = renderHistory();
    else if (view === "templates") html = renderTemplates();
    if (doAnim) html = html.replace('class="wt-screen"', 'class="wt-screen wt-enter"');
    html += renderNav();
    if (toastMsg) html += '<div class="wt-toast">' + esc(toastMsg) + '</div>';
    document.getElementById("app").innerHTML = html;
    animateRings();
  }

  // ---------- actions ----------
  function goStartWorkout() { setView("workout"); render(); }

  function startDraft(arg) {
    var template = arg === "freestyle" ? null : data.templates.find(function (t) { return t.id === arg; });
    data.draft = {
      id: uid("sess"),
      date: new Date().toISOString(),
      templateId: template ? template.id : null,
      templateName: template ? template.name : null,
      dayColor: template ? template.color : null,
      entries: template ? template.exercises.map(function (e) {
        return { exerciseName: e.name, sets: [], note: e.note || null,
          target: e.targetSets ? { sets: e.targetSets, repMin: e.repMin, repMax: e.repMax } : null };
      }) : []
    };
    editingSet = null;
    failFlags = {};
    animateNextRender = true;
    saveData(); render();
  }
  function cancelWorkout() { data.draft = null; editingSet = null; failFlags = {}; saveData(); setView("home"); render(); }
  function finishWorkout() {
    if (sessionSetCount(data.draft) === 0) return;
    data.sessions.push(data.draft);
    data.draft = null;
    editingSet = null;
    failFlags = {};
    saveData();
    setView("history");
    showToast("Workout saved");
  }
  function addExercise(name) {
    var trimmed = (name || "").trim();
    if (!trimmed) return;
    data.draft.entries.push({ exerciseName: trimmed, sets: [], target: null, note: null });
    if (data.exercises.indexOf(trimmed) === -1) data.exercises.push(trimmed);
    saveData(); render();
  }
  function addSet(idx) {
    var w = parseFloat(document.getElementById("w-input-" + idx).value);
    var r = parseInt(document.getElementById("r-input-" + idx).value, 10);
    if (!w || !r) return;
    var entry = data.draft.entries[idx];
    var best = bestWeightFor(entry.exerciseName);
    var isPR = best > 0 && w > best;
    entry.sets.push({ weight: w, reps: r, isPR: isPR, failed: !!failFlags[idx] });
    lastAddedChip = idx + ":" + (entry.sets.length - 1);
    saveData();
    if (isPR) showToast("New personal best — " + w + "kg"); else render();
  }
  function duplicateSet(idx) {
    var entry = data.draft.entries[idx];
    var last = entry.sets[entry.sets.length - 1];
    if (!last) return;
    var best = bestWeightFor(entry.exerciseName);
    var isPR = best > 0 && last.weight > best;
    entry.sets.push({ weight: last.weight, reps: last.reps, isPR: isPR, failed: !!last.failed });
    lastAddedChip = idx + ":" + (entry.sets.length - 1);
    saveData();
    if (isPR) showToast("New personal best — " + last.weight + "kg"); else render();
  }
  function deleteSet(arg) {
    var parts = arg.split(":"); var idx = +parts[0], si = +parts[1];
    data.draft.entries[idx].sets.splice(si, 1);
    if (editingSet && +editingSet.split(":")[0] === idx) editingSet = null;
    saveData(); render();
  }
  function removeExercise(idx) { data.draft.entries.splice(idx, 1); editingSet = null; saveData(); render(); }
  function updateSet(arg) {
    var parts = arg.split(":"); var idx = +parts[0], si = +parts[1];
    var w = parseFloat(document.getElementById("w-input-" + idx).value);
    var r = parseInt(document.getElementById("r-input-" + idx).value, 10);
    if (!w || !r) return;
    var entry = data.draft.entries[idx];
    var best = bestWeightFor(entry.exerciseName);
    var isPR = best > 0 && w > best;
    entry.sets[si] = { weight: w, reps: r, isPR: isPR, failed: !!failFlags[idx] };
    editingSet = null;
    saveData();
    if (isPR) showToast("New personal best — " + w + "kg"); else render();
  }

  function armReset() {
    if (resetArmed) {
      clearTimeout(resetTimer); resetArmed = false;
      data = JSON.parse(JSON.stringify(DEFAULT_DATA));
      saveData(); setView("home"); showToast("Everything reset");
    } else {
      resetArmed = true; render();
      resetTimer = setTimeout(function () { resetArmed = false; render(); }, 3000);
    }
  }
  function armDeleteTemplate(id) {
    if (deleteArmedId === id) {
      clearTimeout(deleteTimer); deleteArmedId = null;
      data.templates = data.templates.filter(function (t) { return t.id !== id; });
      saveData(); render();
    } else {
      deleteArmedId = id; render();
      deleteTimer = setTimeout(function () { deleteArmedId = null; render(); }, 3000);
    }
  }

  function openTemplateEditor(arg) {
    animateNextRender = true;
    if (arg === "new") {
      editingTemplate = null; templateName = ""; templateColor = null; templateRows = {}; templateOrder = [];
    } else {
      var t = data.templates.find(function (x) { return x.id === arg; });
      editingTemplate = t; templateName = t.name; templateColor = t.color || null;
      templateRows = {};
      templateOrder = t.exercises.map(function (e) { return e.name; });
      t.exercises.forEach(function (e) {
        templateRows[e.name] = { checked: true, targetSets: e.targetSets || "", repMin: e.repMin || "", repMax: e.repMax || "", note: e.note || "" };
      });
    }
    render();
  }
  function toggleTemplateExercise(name) {
    var existing = templateRows[name] || { targetSets: "", repMin: "", repMax: "", note: "" };
    var nowChecked = !existing.checked;
    templateRows[name] = Object.assign({}, existing, { checked: nowChecked });
    if (nowChecked) { if (templateOrder.indexOf(name) === -1) templateOrder.push(name); }
    else { templateOrder = templateOrder.filter(function (n) { return n !== name; }); }
    render();
  }
  function moveTemplateExercise(arg) {
    var parts = arg.split(":"); var i = +parts[0], dir = parts[1];
    var j = dir === "up" ? i - 1 : i + 1;
    if (j < 0 || j >= templateOrder.length) return;
    var tmp = templateOrder[i]; templateOrder[i] = templateOrder[j]; templateOrder[j] = tmp;
    render();
  }
  function addTemplateExercise() {
    var input = document.getElementById("new-template-exercise-input");
    var trimmed = input.value.trim();
    if (!trimmed) return;
    if (data.exercises.indexOf(trimmed) === -1) data.exercises.push(trimmed);
    templateRows[trimmed] = { checked: true, targetSets: "", repMin: "", repMax: "", note: "" };
    if (templateOrder.indexOf(trimmed) === -1) templateOrder.push(trimmed);
    saveData(); render();
  }
  function saveTemplate() {
    var name = document.getElementById("template-name-input").value.trim();
    if (!name) { showToast("Give the plan a name first"); return; }
    var orderedNames = templateOrder.filter(function (n) { return templateRows[n] && templateRows[n].checked; });
    var strayNames = Object.keys(templateRows).filter(function (n) { return templateRows[n].checked && orderedNames.indexOf(n) === -1; });
    var exercises = orderedNames.concat(strayNames).map(function (n) {
      var row = templateRows[n];
      return {
        name: n,
        targetSets: row.targetSets ? parseInt(row.targetSets, 10) : undefined,
        repMin: row.repMin ? parseInt(row.repMin, 10) : undefined,
        repMax: row.repMax ? parseInt(row.repMax, 10) : undefined,
        note: row.note || undefined
      };
    });
    if (!exercises.length) { showToast("Pick at least one exercise"); return; }
    var tpl = { id: editingTemplate ? editingTemplate.id : uid("tpl"), name: name, color: templateColor, exercises: exercises };
    var exists = data.templates.some(function (t) { return t.id === tpl.id; });
    data.templates = exists ? data.templates.map(function (t) { return t.id === tpl.id ? tpl : t; }) : data.templates.concat([tpl]);
    saveData();
    editingTemplate = undefined;
    animateNextRender = true;
    showToast("Plan saved");
  }
  function saveGoals() {
    var s = parseInt(document.getElementById("goal-sessions-input").value, 10);
    var se = parseInt(document.getElementById("goal-sets-input").value, 10);
    data.goals = { sessions: s > 0 ? s : data.goals.sessions, sets: se > 0 ? se : data.goals.sets };
    saveData();
    setView("home");
    showToast("Goal updated");
  }

  function exportData() {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "training-log-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Backup downloaded");
  }
  function importData() { document.getElementById("import-file-input").click(); }

  // ---------- event wiring ----------
  document.getElementById("import-file-input").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        data = migrate(Object.assign({}, DEFAULT_DATA, parsed));
        saveData();
        setView("home");
        showToast("Backup restored");
      } catch (err) { showToast("That file couldn't be read"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("app").addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action, arg = el.dataset.arg;
    if (action === "go-view") { setView(arg); render(); }
    else if (action === "go-start-workout") goStartWorkout();
    else if (action === "start-draft") startDraft(arg);
    else if (action === "cancel-workout") cancelWorkout();
    else if (action === "finish-workout") finishWorkout();
    else if (action === "add-set") addSet(+arg);
    else if (action === "update-set") updateSet(arg);
    else if (action === "edit-set") {
      var ep = arg.split(":");
      var es = data.draft.entries[+ep[0]].sets[+ep[1]];
      failFlags[+ep[0]] = !!(es && es.failed);
      editingSet = arg; render();
    }
    else if (action === "toggle-fail") {
      failFlags[arg] = !failFlags[arg];
      el.classList.toggle("on", !!failFlags[arg]);
      el.setAttribute("aria-pressed", failFlags[arg] ? "true" : "false");
    }
    else if (action === "use-weight") {
      var uw = arg.split(":");
      var wInput = document.getElementById("w-input-" + uw[0]);
      if (wInput) { wInput.value = uw[1]; var rInput = document.getElementById("r-input-" + uw[0]); if (rInput) rInput.focus(); }
    }
    else if (action === "set-step") {
      data.settings = Object.assign({}, data.settings, { weightStep: parseFloat(arg) });
      saveData(); render();
    }
    else if (action === "cancel-edit-set") { editingSet = null; render(); }
    else if (action === "duplicate-set") duplicateSet(+arg);
    else if (action === "delete-set") deleteSet(arg);
    else if (action === "remove-exercise") removeExercise(+arg);
    else if (action === "edit-emoji") promptEmoji(arg);
    else if (action === "move-template-exercise") moveTemplateExercise(arg);
    else if (action === "add-exercise") addExercise(document.getElementById("new-exercise-input").value);
    else if (action === "quick-add-exercise") addExercise(arg);
    else if (action === "reset-data") armReset();
    else if (action === "export-data") exportData();
    else if (action === "import-data") importData();
    else if (action === "edit-template") openTemplateEditor(arg);
    else if (action === "cancel-template-edit") { animateNextRender = true; editingTemplate = undefined; render(); }
    else if (action === "toggle-template-exercise") toggleTemplateExercise(arg);
    else if (action === "set-template-color") { templateColor = arg === "none" ? null : arg; render(); }
    else if (action === "add-template-exercise") addTemplateExercise();
    else if (action === "save-template") saveTemplate();
    else if (action === "delete-template") armDeleteTemplate(arg);
    else if (action === "toggle-history") { historyOpenId = historyOpenId === arg ? null : arg; render(); }
    else if (action === "set-history-color") { historyColorFilter = arg === "" ? null : arg; render(); }
    else if (action === "set-history-range") { historyRange = arg; render(); }
    else if (action === "set-progress-exercise") { progressExercise = arg; render(); }
    else if (action === "save-goals") saveGoals();
  });

  document.getElementById("app").addEventListener("input", function (e) {
    var el = e.target;
    if (el.id === "history-search-input") {
      historySearch = el.value;
      render();
      var ne = document.getElementById("history-search-input");
      if (ne) { ne.focus(); var v = ne.value; ne.setSelectionRange(v.length, v.length); }
      return;
    }
    if (el.dataset && el.dataset.field && el.dataset.name != null) {
      var row = templateRows[el.dataset.name] || {};
      row[el.dataset.field] = el.value;
      templateRows[el.dataset.name] = row;
    }
  });

  document.getElementById("app").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "new-exercise-input") addExercise(e.target.value);
    if (e.target.id === "new-template-exercise-input") addTemplateExercise();
  });

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
