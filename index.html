<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Workout Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout Log">
<meta name="theme-color" content="#0B0F14">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: #0B0F14;
  overscroll-behavior-y: none;
}
body {
  --bg: #0B0F14;
  --surface: #141A22;
  --surface-2: #1C242F;
  --border: #262F3B;
  --text: #EDEFF2;
  --dim: #8B96A3;
  --accent: #FFC93C;
  --accent-dark: #2A2100;
  --pr: #4ADE80;
  --push: #FF4D4D;
  --pull: #3B82F6;
  --mix: #A855F7;
  font-family: 'Inter', sans-serif;
  color: var(--text);
  min-height: 100vh;
}
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  padding-top: env(safe-area-inset-top);
}
.wt-loading { display: flex; align-items: center; justify-content: center; height: 100vh; gap: 10px; color: var(--dim); }
.wt-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.wt-screen { padding: 20px 18px 100px; flex: 1; }
.wt-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.wt-display { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 32px; line-height: 1.1; margin: 0 0 6px; }
.wt-h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; margin: 0 0 12px; }
.wt-subtle { color: var(--dim); font-size: 14px; line-height: 1.5; margin: 0 0 16px; }
.wt-mono { font-family: 'IBM Plex Mono', monospace; }
.wt-dim { color: var(--dim); }

.wt-week { display: flex; justify-content: space-between; margin: 18px 0 22px; }
.wt-week-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.wt-week-letter { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--dim); }
.wt-week-dot { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border); background: transparent; }
.wt-week-dot-today { box-shadow: 0 0 0 2px var(--accent); }

.wt-set-tally { margin: 16px 0 20px; }
.wt-set-tally-row { display: flex; gap: 4px; align-items: center; min-height: 20px; flex-wrap: wrap; }
.wt-set-tally-mark { width: 16px; height: 8px; border-radius: 2px; }
.wt-plate-label { font-size: 12px; color: var(--dim); margin-top: 8px; }

.wt-cta { width: 100%; background: var(--accent); color: #201800; border: none; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin: 6px 0 20px; }
.wt-cta:disabled { background: var(--surface-2); color: var(--dim); }
.wt-cta-finish { position: sticky; bottom: 78px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }

.wt-section { margin-top: 18px; }
.wt-section-title { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin: 18px 0 10px; }

.wt-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.wt-card-dashed { border-style: dashed; }
.wt-card-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wt-card-title { font-weight: 600; font-size: 15px; }
.wt-card-meta { color: var(--dim); font-size: 12.5px; margin-top: 4px; }
.wt-target { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--dim); margin-top: 2px; }

.wt-row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.wt-row-center { display: flex; align-items: center; }

.wt-icon-btn { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 8px 10px; display: flex; cursor: pointer; font-size: 15px; }
.wt-icon-btn-quiet { background: transparent; border: none; padding: 6px; color: var(--dim); font-size: 15px; }

.wt-option { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 14px; margin-bottom: 8px; font-size: 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; text-align: left; }

.wt-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.wt-chip { background: var(--surface-2); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; }
.wt-chip-pr { color: var(--pr); border: 1px solid var(--pr); }
.wt-chip-x { background: none; border: none; color: var(--dim); cursor: pointer; display: inline-flex; padding: 0; font-size: 13px; }

.wt-set-form { display: flex; gap: 6px; }
.wt-input { flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 10px 12px; font-size: 14px; min-width: 0; font-family: inherit; }
.wt-input-num { text-align: center; }
.wt-input-tiny { flex: 1; padding: 8px 6px; font-size: 12.5px; text-align: center; }
.wt-add-set-btn { background: var(--accent-dark); color: var(--accent); border: 1px solid var(--accent); border-radius: 9px; padding: 0 14px; display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.wt-duplicate-btn { margin-top: 8px; background: none; border: none; color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; padding: 0; }
.wt-best-hint { margin-top: 6px; font-size: 11.5px; color: var(--dim); }

.wt-quick-add-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.wt-quick-add-chip { background: var(--surface-2); border: 1px solid var(--border); color: var(--dim); border-radius: 20px; padding: 6px 12px; font-size: 12.5px; cursor: pointer; }

.wt-tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.wt-tag { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 12.5px; color: var(--dim); }

.wt-color-row { display: flex; gap: 10px; margin-bottom: 16px; }
.wt-color-dot { width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer; padding: 0; }
.wt-color-dot-active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

.wt-checklist { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.wt-check-block { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
.wt-check-block-active { border-color: var(--accent); }
.wt-check-row { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: none; padding: 8px; color: var(--text); font-size: 14px; cursor: pointer; text-align: left; font-family: inherit; }
.wt-checkbox { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; font-size: 12px; }
.wt-checkbox-checked { border-color: var(--accent); background: var(--accent-dark); }
.wt-target-inputs { display: flex; gap: 6px; padding: 0 8px 8px; }

.wt-history-header { width: 100%; background: none; border: none; color: var(--text); display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 0; gap: 10px; font-family: inherit; }
.wt-history-detail { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.wt-history-exercise-name { font-size: 13.5px; font-weight: 600; margin-bottom: 4px; }
.wt-confirm-text { font-size: 11.5px; color: #FF4D4D; margin-top: 6px; }

.wt-links-row { display: flex; gap: 16px; margin-top: 24px; flex-wrap: wrap; }
.wt-text-link { background: none; border: none; color: var(--dim); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; font-family: inherit; }

.wt-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--border); display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); }
.wt-nav-btn { flex: 1; background: none; border: none; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; padding: 6px 0; cursor: pointer; font-family: inherit; }
.wt-nav-active { color: var(--accent); }
.wt-nav-icon { font-size: 18px; position: relative; }
.wt-nav-dot { position: absolute; top: -2px; right: -4px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.wt-toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 20px; font-size: 13.5px; z-index: 20; }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="import-file-input" accept="application/json" style="display:none">
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "workout-app-data-v1";
  var DAY_COLORS = { push: "#FF4D4D", pull: "#3B82F6", mix: "#A855F7" };

  var SEED_TEMPLATES = [
    { id: "push-day", name: "Push Day", color: "push", exercises: [
      { name: "Walking Lunges", emoji: "🦵", targetSets: 3, repMin: 10, repMax: 12 },
      { name: "Flat Bench Press", emoji: "💥", targetSets: 4, repMin: 8, repMax: 10 },
      { name: "Machine Fly / Cables", emoji: "🦋", targetSets: 3, repMin: 8, repMax: 10 },
      { name: "Seated Dumbbell Press", emoji: "🚀", targetSets: 3, repMin: 8, repMax: 12 },
      { name: "Dips", emoji: "💪", targetSets: 3, repMin: 10, repMax: 15 },
      { name: "Abs", emoji: "🍫", targetSets: 3, repMin: 10, repMax: 15, note: "×2" }
    ]},
    { id: "pull-day", name: "Pull Day", color: "pull", exercises: [
      { name: "Goblet Squat", emoji: "🦵", targetSets: 3, repMin: 10, repMax: 12 },
      { name: "Pull-downs", emoji: "🦍", targetSets: 3, repMin: 8, repMax: 12 },
      { name: "Machine Rows", emoji: "🚣", targetSets: 3, repMin: 8, repMax: 12 },
      { name: "Face Pulls", emoji: "🙆", targetSets: 3, repMin: 15, repMax: 20 },
      { name: "Biceps Curls", emoji: "💪", targetSets: 3, repMin: 10, repMax: 15 },
      { name: "Abs", emoji: "🍫", targetSets: 3, repMin: 10, repMax: 15, note: "×2" }
    ]},
    { id: "mix-day", name: "Mix Day", color: "mix", exercises: [
      { name: "DB RDL", emoji: "🚜", targetSets: 3, repMin: 6, repMax: 10 },
      { name: "Incline DB Press", emoji: "📐", targetSets: 3, repMin: 8, repMax: 12 },
      { name: "Bulgarian Split Squats", emoji: "💀", targetSets: 3, repMin: 10, repMax: 12 },
      { name: "Pull-Ups", emoji: "🦍", targetSets: 3, repMin: 8, repMax: 12 },
      { name: "Lateral Raises", emoji: "🦅", targetSets: 3, repMin: 15, repMax: 20 },
      { name: "Abs", emoji: "🍫", targetSets: 3, repMin: 10, repMax: 15, note: "×2" }
    ]}
  ];
  var SEED_EXERCISES = Array.from(new Set(SEED_TEMPLATES.flatMap(function (t) { return t.exercises.map(function (e) { return e.name; }); })));
  var DEFAULT_DATA = { exercises: SEED_EXERCISES, templates: SEED_TEMPLATES, sessions: [], draft: null };

  // ---------- state ----------
  var data = loadData();
  var view = "home";
  var resetArmed = false, resetTimer = null;
  var deleteArmedId = null, deleteTimer = null;
  var toastMsg = null, toastTimer = null;
  var historyOpenId = null;
  var editingTemplate = undefined; // undefined = list, null = new, object = editing
  var templateRows = {}; // name -> {checked, targetSets, repMin, repMax, note}
  var templateName = "";
  var templateColor = null;

  function uid(p) { return p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return Object.assign({}, DEFAULT_DATA, JSON.parse(raw));
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch (e) { showToast("Couldn't save — storage may be full"); }
  }

  function formatDateLong(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }
  function daysAgoText(iso) {
    var then = new Date(iso), now = new Date();
    var diff = Math.floor((new Date(now.toDateString()) - new Date(then.toDateString())) / 86400000);
    if (diff <= 0) return "Today";
    if (diff === 1) return "Yesterday";
    return diff + " days ago";
  }
  function sessionVolume(s) { return s.entries.reduce(function (sum, e) { return sum + e.sets.reduce(function (a, x) { return a + x.weight * x.reps; }, 0); }, 0); }
  function sessionSetCount(s) { return s.entries.reduce(function (sum, e) { return sum + e.sets.length; }, 0); }
  function bestWeightFor(name) {
    var best = 0;
    data.sessions.forEach(function (s) {
      s.entries.forEach(function (e) {
        if (e.exerciseName === name) e.sets.forEach(function (set) { if (set.weight > best) best = set.weight; });
      });
    });
    return best;
  }
  function targetText(entry) {
    if (!entry.target || !entry.target.sets) return null;
    var t = "Target " + entry.target.sets + " × " + entry.target.repMin + (entry.target.repMax && entry.target.repMax !== entry.target.repMin ? "–" + entry.target.repMax : "");
    if (entry.note) t += " (" + entry.note + ")";
    return t;
  }

  function showToast(msg) {
    toastMsg = msg;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastMsg = null; render(); }, 2200);
  }

  // ---------- render helpers ----------
  function weekStripHtml() {
    var today = new Date(), cols = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today); d.setDate(today.getDate() - i);
      var match = data.sessions.find(function (s) { return new Date(s.date).toDateString() === d.toDateString(); });
      var color = match ? (DAY_COLORS[match.dayColor] || "#8B96A3") : null;
      var isToday = d.toDateString() === today.toDateString();
      cols.push(
        '<div class="wt-week-col"><span class="wt-week-letter">' + d.toLocaleDateString("en-US", { weekday: "narrow" }) +
        '</span><span class="wt-week-dot' + (isToday ? " wt-week-dot-today" : "") + '" style="' + (color ? "background:" + color : "") + '"></span></div>'
      );
    }
    return '<div class="wt-week">' + cols.join("") + "</div>";
  }

  function chipsHtml(entryIdx, sets) {
    return '<div class="wt-chip-row">' + sets.map(function (set, si) {
      return '<span class="wt-chip' + (set.isPR ? " wt-chip-pr" : "") + '">' + (set.isPR ? "★ " : "") +
        '<span class="wt-mono">' + set.weight + "kg × " + set.reps + '</span>' +
        '<button class="wt-chip-x" data-action="delete-set" data-arg="' + entryIdx + ":" + si + '">✕</button></span>';
    }).join("") + "</div>";
  }

  // ---------- screens ----------
  function renderHome() {
    var last = data.sessions[data.sessions.length - 1];
    var hour = new Date().getHours();
    var greeting = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
    var recent = data.sessions.slice(-3).reverse().map(function (s) {
      var border = s.dayColor ? "border-left:3px solid " + DAY_COLORS[s.dayColor] + ";" : "";
      return '<div class="wt-card" style="' + border + '"><div class="wt-card-row"><span class="wt-card-title">' + esc(s.templateName || "Freestyle") +
        '</span><span class="wt-mono wt-dim">' + daysAgoText(s.date) + '</span></div><div class="wt-card-meta">' +
        s.entries.length + " exercises · " + sessionSetCount(s) + " sets</div></div>";
    }).join("");

    return '<div class="wt-screen">' +
      '<div class="wt-eyebrow">Training Log</div>' +
      '<h1 class="wt-display">' + greeting + '</h1>' +
      (last
        ? '<p class="wt-subtle">Last workout: ' + daysAgoText(last.date) + " · " + sessionSetCount(last) + " sets · " + sessionVolume(last).toLocaleString() + " kg</p>"
        : '<p class="wt-subtle">No workouts logged yet. Let\'s start one.</p>') +
      weekStripHtml() +
      '<button class="wt-cta" data-action="go-start-workout">🏋️ Start Workout</button>' +
      (data.sessions.length ? '<div class="wt-section"><div class="wt-section-title">Recent</div>' + recent + '</div>' : '') +
      '<div class="wt-links-row">' +
      '<button class="wt-text-link" data-action="export-data">Export backup</button>' +
      '<button class="wt-text-link" data-action="import-data">Import backup</button>' +
      '<button class="wt-text-link" data-action="reset-data">' + (resetArmed ? "Tap again to reset all data" : "Reset data") + '</button>' +
      '</div>' +
      '</div>';
  }

  function renderStartChoice() {
    var opts = data.templates.map(function (t) {
      var border = t.color ? "border-left:3px solid " + DAY_COLORS[t.color] + ";" : "";
      return '<button class="wt-option" style="' + border + '" data-action="start-draft" data-arg="' + t.id + '"><span>' + esc(t.name) +
        '</span><span class="wt-dim wt-mono">' + t.exercises.length + ' exercises</span></button>';
    }).join("");
    return '<div class="wt-screen">' +
      '<div class="wt-row-between"><h2 class="wt-h2">Choose a plan</h2><button class="wt-icon-btn" data-action="go-view" data-arg="home">✕</button></div>' +
      '<button class="wt-option" data-action="start-draft" data-arg="freestyle"><span>Freestyle</span><span>+</span></button>' +
      opts +
      '</div>';
  }

  function renderWorkout() {
    var draft = data.draft;
    var usedNames = {};
    draft.entries.forEach(function (e) { usedNames[e.exerciseName] = true; });
    var available = data.exercises.filter(function (n) { return !usedNames[n]; });
    var totalSets = sessionSetCount(draft);
    var badgeColor = draft.dayColor ? DAY_COLORS[draft.dayColor] : "var(--border)";

    var tally = '<div class="wt-set-tally"><div class="wt-set-tally-row">' +
      Array.from({ length: Math.min(totalSets, 16) }).map(function () {
        return '<span class="wt-set-tally-mark" style="background:' + badgeColor + '"></span>';
      }).join("") +
      (totalSets === 0 ? '<span class="wt-dim" style="font-size:12.5px">No sets logged yet</span>' : "") +
      '</div><div class="wt-plate-label">' + totalSets + ' sets this workout</div></div>';

    var cards = draft.entries.map(function (entry, idx) {
      var t = targetText(entry);
      var best = bestWeightFor(entry.exerciseName);
      return '<div class="wt-card">' +
        '<div class="wt-card-row"><span class="wt-card-title">' + (entry.emoji ? entry.emoji + " " : "") + esc(entry.exerciseName) +
        '</span><button class="wt-icon-btn-quiet" data-action="remove-exercise" data-arg="' + idx + '">🗑</button></div>' +
        (t ? '<div class="wt-target">' + esc(t) + '</div>' : '') +
        (entry.sets.length ? chipsHtml(idx, entry.sets) : '') +
        '<div class="wt-set-form">' +
        '<input class="wt-input wt-input-num" type="number" inputmode="decimal" placeholder="kg" id="w-input-' + idx + '">' +
        '<input class="wt-input wt-input-num" type="number" inputmode="numeric" placeholder="reps" id="r-input-' + idx + '">' +
        '<button class="wt-add-set-btn" data-action="add-set" data-arg="' + idx + '">+ Add</button>' +
        '</div>' +
        (entry.sets.length ? '<button class="wt-duplicate-btn" data-action="duplicate-set" data-arg="' + idx + '">⤿ Repeat last set</button>' : '') +
        (best > 0 ? '<div class="wt-best-hint">Best so far: ' + best + 'kg</div>' : '') +
        '</div>';
    }).join("");

    var quickChips = available.slice(0, 6).map(function (n) {
      return '<button class="wt-quick-add-chip" data-action="quick-add-exercise" data-arg="' + esc(n) + '">' + esc(n) + '</button>';
    }).join("");

    return '<div class="wt-screen">' +
      '<div class="wt-row-between"><div><div class="wt-eyebrow" style="color:' + badgeColor + '">' + esc(draft.templateName || "Freestyle") +
      '</div><h2 class="wt-h2">' + formatDateLong(draft.date) + '</h2></div>' +
      '<button class="wt-icon-btn-quiet" data-action="cancel-workout">✕</button></div>' +
      tally + cards +
      '<div class="wt-card wt-card-dashed"><div class="wt-card-title" style="margin-bottom:8px">Add exercise</div>' +
      '<div class="wt-set-form"><input class="wt-input" list="exercise-options" placeholder="Exercise name" id="new-exercise-input">' +
      '<datalist id="exercise-options">' + available.map(function (n) { return '<option value="' + esc(n) + '">'; }).join("") + '</datalist>' +
      '<button class="wt-add-set-btn" data-action="add-exercise">+ Add</button></div>' +
      (available.length ? '<div class="wt-quick-add-row">' + quickChips + '</div>' : '') +
      '</div>' +
      '<button class="wt-cta wt-cta-finish" data-action="finish-workout"' + (totalSets === 0 ? " disabled" : "") + '>✓ Finish Workout</button>' +
      '</div>';
  }

  function renderHistory() {
    var ordered = data.sessions.slice().reverse();
    if (!ordered.length) {
      return '<div class="wt-screen"><h2 class="wt-h2">History</h2><p class="wt-subtle">No workouts saved yet. Every finished workout will show up here.</p></div>';
    }
    var items = ordered.map(function (s) {
      var open = historyOpenId === s.id;
      var border = s.dayColor ? "border-left:3px solid " + DAY_COLORS[s.dayColor] + ";" : "";
      var detail = open ? '<div class="wt-history-detail">' + s.entries.map(function (e) {
        return '<div><div class="wt-history-exercise-name">' + (e.emoji ? e.emoji + " " : "") + esc(e.exerciseName) + '</div>' + chipsHtmlReadOnly(e.sets) + '</div>';
      }).join("") + '</div>' : '';
      return '<div class="wt-card" style="' + border + '">' +
        '<button class="wt-history-header" data-action="toggle-history" data-arg="' + s.id + '">' +
        '<div><div class="wt-card-title">' + esc(s.templateName || "Freestyle") + '</div><div class="wt-card-meta">' + formatDateLong(s.date) + '</div></div>' +
        '<div class="wt-row-center"><span class="wt-mono wt-dim">' + sessionSetCount(s) + " sets · " + sessionVolume(s).toLocaleString() + ' kg</span>&nbsp;' + (open ? "▴" : "▾") + '</div>' +
        '</button>' + detail + '</div>';
    }).join("");
    return '<div class="wt-screen"><h2 class="wt-h2">History</h2>' + items + '</div>';
  }
  function chipsHtmlReadOnly(sets) {
    return '<div class="wt-chip-row">' + sets.map(function (set) {
      return '<span class="wt-chip' + (set.isPR ? " wt-chip-pr" : "") + '">' + (set.isPR ? "★ " : "") + '<span class="wt-mono">' + set.weight + "kg × " + set.reps + '</span></span>';
    }).join("") + '</div>';
  }

  function renderTemplates() {
    if (editingTemplate !== undefined) return renderTemplateEditor();
    var items = data.templates.map(function (t) {
      var border = t.color ? "border-left:3px solid " + DAY_COLORS[t.color] + ";" : "";
      return '<div class="wt-card" style="' + border + '"><div class="wt-card-row"><span class="wt-card-title">' + esc(t.name) + '</span>' +
        '<div class="wt-row-center" style="gap:6px"><button class="wt-icon-btn-quiet" data-action="edit-template" data-arg="' + t.id + '">📋</button>' +
        '<button class="wt-icon-btn-quiet" data-action="delete-template" data-arg="' + t.id + '" style="' + (deleteArmedId === t.id ? "color:#FF4D4D" : "") + '">🗑</button></div></div>' +
        '<div class="wt-card-meta">' + t.exercises.map(function (e) { return esc(e.name); }).join(" · ") + '</div>' +
        (deleteArmedId === t.id ? '<div class="wt-confirm-text">Tap the trash icon again to delete</div>' : '') +
        '</div>';
    }).join("");
    var tags = data.exercises.map(function (n) { return '<span class="wt-tag">' + esc(n) + '</span>'; }).join("");
    return '<div class="wt-screen"><div class="wt-row-between"><h2 class="wt-h2">Plans</h2>' +
      '<button class="wt-icon-btn" data-action="edit-template" data-arg="new">+</button></div>' +
      items + '<div class="wt-section-title">Exercise library</div><div class="wt-tag-row">' + tags + '</div></div>';
  }

  function renderTemplateEditor() {
    var checklist = data.exercises.map(function (n) {
      var row = templateRows[n];
      var checked = row && row.checked;
      var inputs = checked ? '<div class="wt-target-inputs">' +
        '<input class="wt-input wt-input-tiny" type="number" placeholder="Sets" value="' + (row.targetSets || "") + '" data-name="' + esc(n) + '" data-field="targetSets">' +
        '<input class="wt-input wt-input-tiny" type="number" placeholder="Min reps" value="' + (row.repMin || "") + '" data-name="' + esc(n) + '" data-field="repMin">' +
        '<input class="wt-input wt-input-tiny" type="number" placeholder="Max reps" value="' + (row.repMax || "") + '" data-name="' + esc(n) + '" data-field="repMax">' +
        '</div>' : '';
      return '<div class="wt-check-block' + (checked ? " wt-check-block-active" : "") + '">' +
        '<button class="wt-check-row" data-action="toggle-template-exercise" data-arg="' + esc(n) + '">' +
        '<span class="wt-checkbox' + (checked ? " wt-checkbox-checked" : "") + '">' + (checked ? "✓" : "") + '</span>' + esc(n) + '</button>' + inputs + '</div>';
    }).join("");

    var colorDots = '<button class="wt-color-dot' + (templateColor === null ? " wt-color-dot-active" : "") +
      '" style="background:var(--surface-2);border:1px solid var(--border)" data-action="set-template-color" data-arg="none"></button>' +
      Object.keys(DAY_COLORS).map(function (key) {
        return '<button class="wt-color-dot' + (templateColor === key ? " wt-color-dot-active" : "") + '" style="background:' + DAY_COLORS[key] + '" data-action="set-template-color" data-arg="' + key + '"></button>';
      }).join("");

    return '<div class="wt-screen">' +
      '<div class="wt-row-between"><h2 class="wt-h2">' + (editingTemplate ? "Edit Plan" : "New Plan") + '</h2>' +
      '<button class="wt-icon-btn" data-action="cancel-template-edit">✕</button></div>' +
      '<input class="wt-input" placeholder="Plan name (e.g. Push Day)" id="template-name-input" value="' + esc(templateName) + '">' +
      '<div class="wt-section-title">Color tag</div><div class="wt-color-row">' + colorDots + '</div>' +
      '<div class="wt-section-title">Exercises</div><div class="wt-checklist">' + checklist + '</div>' +
      '<div class="wt-set-form"><input class="wt-input" placeholder="New exercise" id="new-template-exercise-input">' +
      '<button class="wt-add-set-btn" data-action="add-template-exercise">+ Add</button></div>' +
      '<button class="wt-cta" data-action="save-template">Save Plan</button>' +
      '</div>';
  }

  function renderNav() {
    var items = [
      { key: "home", label: "Home", icon: "🏠" },
      { key: "workout", label: "Workout", icon: "🏋️" },
      { key: "history", label: "History", icon: "📜" },
      { key: "templates", label: "Plans", icon: "📋" }
    ];
    return '<div class="wt-nav">' + items.map(function (it) {
      var active = view === it.key;
      var dot = it.key === "workout" && data.draft ? '<span class="wt-nav-dot"></span>' : "";
      return '<button class="wt-nav-btn' + (active ? " wt-nav-active" : "") + '" data-action="go-view" data-arg="' + it.key + '">' +
        '<span class="wt-nav-icon">' + it.icon + dot + '</span><span>' + it.label + '</span></button>';
    }).join("") + '</div>';
  }

  // ---------- main render ----------
  function render() {
    var html = "";
    if (view === "home") html = renderHome();
    else if (view === "workout") html = data.draft ? renderWorkout() : renderStartChoice();
    else if (view === "history") html = renderHistory();
    else if (view === "templates") html = renderTemplates();
    html += renderNav();
    if (toastMsg) html += '<div class="wt-toast">' + esc(toastMsg) + '</div>';
    document.getElementById("app").innerHTML = html;
  }

  // ---------- actions ----------
  function goStartWorkout() { view = "workout"; render(); }

  function startDraft(arg) {
    var template = arg === "freestyle" ? null : data.templates.find(function (t) { return t.id === arg; });
    data.draft = {
      id: uid("sess"),
      date: new Date().toISOString(),
      templateId: template ? template.id : null,
      templateName: template ? template.name : null,
      dayColor: template ? template.color : null,
      entries: template ? template.exercises.map(function (e) {
        return { exerciseName: e.name, emoji: e.emoji || null, sets: [], note: e.note || null,
          target: e.targetSets ? { sets: e.targetSets, repMin: e.repMin, repMax: e.repMax } : null };
      }) : []
    };
    saveData(); render();
  }
  function cancelWorkout() { data.draft = null; saveData(); view = "home"; render(); }
  function finishWorkout() {
    if (sessionSetCount(data.draft) === 0) return;
    data.sessions.push(data.draft);
    data.draft = null;
    saveData();
    view = "history";
    showToast("Workout saved 💪");
  }
  function addExercise(name) {
    var trimmed = (name || "").trim();
    if (!trimmed) return;
    data.draft.entries.push({ exerciseName: trimmed, emoji: null, sets: [], target: null, note: null });
    if (data.exercises.indexOf(trimmed) === -1) data.exercises.push(trimmed);
    saveData(); render();
  }
  function addSet(idx) {
    var w = parseFloat(document.getElementById("w-input-" + idx).value);
    var r = parseInt(document.getElementById("r-input-" + idx).value, 10);
    if (!w || !r) return;
    var entry = data.draft.entries[idx];
    var best = bestWeightFor(entry.exerciseName);
    entry.sets.push({ weight: w, reps: r, isPR: best > 0 && w > best });
    saveData(); render();
  }
  function duplicateSet(idx) {
    var entry = data.draft.entries[idx];
    var last = entry.sets[entry.sets.length - 1];
    if (!last) return;
    var best = bestWeightFor(entry.exerciseName);
    entry.sets.push({ weight: last.weight, reps: last.reps, isPR: best > 0 && last.weight > best });
    saveData(); render();
  }
  function deleteSet(arg) {
    var parts = arg.split(":"); var idx = +parts[0], si = +parts[1];
    data.draft.entries[idx].sets.splice(si, 1);
    saveData(); render();
  }
  function removeExercise(idx) { data.draft.entries.splice(idx, 1); saveData(); render(); }

  function armReset() {
    if (resetArmed) {
      clearTimeout(resetTimer); resetArmed = false;
      data = JSON.parse(JSON.stringify(DEFAULT_DATA));
      saveData(); view = "home"; showToast("Everything reset");
    } else {
      resetArmed = true; render();
      resetTimer = setTimeout(function () { resetArmed = false; render(); }, 3000);
    }
  }

  function armDeleteTemplate(id) {
    if (deleteArmedId === id) {
      clearTimeout(deleteTimer); deleteArmedId = null;
      data.templates = data.templates.filter(function (t) { return t.id !== id; });
      saveData(); render();
    } else {
      deleteArmedId = id; render();
      deleteTimer = setTimeout(function () { deleteArmedId = null; render(); }, 3000);
    }
  }

  function openTemplateEditor(arg) {
    if (arg === "new") {
      editingTemplate = null; templateName = ""; templateColor = null; templateRows = {};
    } else {
      var t = data.templates.find(function (x) { return x.id === arg; });
      editingTemplate = t; templateName = t.name; templateColor = t.color || null;
      templateRows = {};
      t.exercises.forEach(function (e) {
        templateRows[e.name] = { checked: true, targetSets: e.targetSets || "", repMin: e.repMin || "", repMax: e.repMax || "", note: e.note || "" };
      });
    }
    render();
  }
  function toggleTemplateExercise(name) {
    var existing = templateRows[name] || { targetSets: "", repMin: "", repMax: "", note: "" };
    templateRows[name] = Object.assign({}, existing, { checked: !existing.checked });
    render();
  }
  function addTemplateExercise() {
    var input = document.getElementById("new-template-exercise-input");
    var trimmed = input.value.trim();
    if (!trimmed) return;
    if (data.exercises.indexOf(trimmed) === -1) data.exercises.push(trimmed);
    templateRows[trimmed] = { checked: true, targetSets: "", repMin: "", repMax: "", note: "" };
    saveData(); render();
  }
  function saveTemplate() {
    var name = document.getElementById("template-name-input").value.trim();
    if (!name) { showToast("Give the plan a name first"); return; }
    var exercises = Object.keys(templateRows).filter(function (n) { return templateRows[n].checked; }).map(function (n) {
      var row = templateRows[n];
      return {
        name: n,
        targetSets: row.targetSets ? parseInt(row.targetSets, 10) : undefined,
        repMin: row.repMin ? parseInt(row.repMin, 10) : undefined,
        repMax: row.repMax ? parseInt(row.repMax, 10) : undefined,
        note: row.note || undefined
      };
    });
    if (!exercises.length) { showToast("Pick at least one exercise"); return; }
    var tpl = { id: editingTemplate ? editingTemplate.id : uid("tpl"), name: name, color: templateColor, exercises: exercises };
    var exists = data.templates.some(function (t) { return t.id === tpl.id; });
    data.templates = exists ? data.templates.map(function (t) { return t.id === tpl.id ? tpl : t; }) : data.templates.concat([tpl]);
    saveData();
    editingTemplate = undefined;
    showToast("Plan saved");
  }

  function exportData() {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "workout-log-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Backup downloaded");
  }
  function importData() { document.getElementById("import-file-input").click(); }

  // ---------- event wiring ----------
  document.getElementById("import-file-input").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        data = Object.assign({}, DEFAULT_DATA, parsed);
        saveData();
        showToast("Backup restored");
        view = "home"; render();
      } catch (err) { showToast("That file couldn't be read"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("app").addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action, arg = el.dataset.arg;
    if (action === "go-view") { view = arg; render(); }
    else if (action === "go-start-workout") goStartWorkout();
    else if (action === "start-draft") startDraft(arg);
    else if (action === "cancel-workout") cancelWorkout();
    else if (action === "finish-workout") finishWorkout();
    else if (action === "add-set") addSet(+arg);
    else if (action === "duplicate-set") duplicateSet(+arg);
    else if (action === "delete-set") deleteSet(arg);
    else if (action === "remove-exercise") removeExercise(+arg);
    else if (action === "add-exercise") addExercise(document.getElementById("new-exercise-input").value);
    else if (action === "quick-add-exercise") addExercise(arg);
    else if (action === "reset-data") armReset();
    else if (action === "export-data") exportData();
    else if (action === "import-data") importData();
    else if (action === "edit-template") openTemplateEditor(arg);
    else if (action === "cancel-template-edit") { editingTemplate = undefined; render(); }
    else if (action === "toggle-template-exercise") toggleTemplateExercise(arg);
    else if (action === "set-template-color") { templateColor = arg === "none" ? null : arg; render(); }
    else if (action === "add-template-exercise") addTemplateExercise();
    else if (action === "save-template") saveTemplate();
    else if (action === "delete-template") armDeleteTemplate(arg);
    else if (action === "toggle-history") { historyOpenId = historyOpenId === arg ? null : arg; render(); }
  });

  document.getElementById("app").addEventListener("input", function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.field && el.dataset.name != null) {
      var row = templateRows[el.dataset.name] || {};
      row[el.dataset.field] = el.value;
      templateRows[el.dataset.name] = row;
    }
  });

  document.getElementById("app").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "new-exercise-input") addExercise(e.target.value);
    if (e.target.id === "new-template-exercise-input") addTemplateExercise();
  });

  render();
})();
</script>
</body>
</html>
