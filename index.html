<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Training Log</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Log">
<meta name="theme-color" content="#0D0D0C">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: #0D0D0C; overscroll-behavior-y: none; }
body {
  --bg: #0D0D0C;
  --surface: #161514;
  --surface-2: #1E1C1A;
  --border: #2C2A27;
  --text: #F3F1EC;
  --dim: #8F8B84;
  --faint: #55524C;
  --accent: #C6A15B;
  --accent-ink: #241C0D;
  --pr: #7FA98C;
  --push: #B8574A;
  --pull: #4C7996;
  --mix: #876AA0;
  font-family: 'Inter', sans-serif;
  color: var(--text);
  min-height: 100vh;
}
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-top: env(safe-area-inset-top); }
.wt-loading { display: flex; align-items: center; justify-content: center; height: 100vh; gap: 10px; color: var(--dim); }
.wt-spinner { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
svg { display: block; }

.wt-screen { padding: 26px 20px 104px; flex: 1; }
.wt-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.wt-display { font-family: 'Fraunces', serif; font-weight: 500; font-size: 34px; line-height: 1.08; margin: 0 0 10px; letter-spacing: -0.01em; }
.wt-h2 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 24px; margin: 0; letter-spacing: -0.01em; }
.wt-subtle { color: var(--dim); font-size: 13.5px; line-height: 1.55; margin: 0 0 22px; }
.wt-mono { font-family: 'IBM Plex Mono', monospace; }
.wt-dim { color: var(--dim); }

/* ---- progress ring ---- */
.wt-ring-block { display: flex; align-items: center; gap: 20px; margin: 22px 0 26px; }
.wt-ring-wrap { position: relative; width: 92px; height: 92px; flex-shrink: 0; }
.wt-ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.wt-ring-num { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; line-height: 1; }
.wt-ring-denom { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--dim); margin-top: 3px; }
.wt-ring-caption { font-size: 13px; color: var(--dim); line-height: 1.5; }
.wt-ring-caption b { color: var(--text); font-weight: 600; }

/* ---- week strip ---- */
.wt-week { display: flex; justify-content: space-between; margin: 4px 0 26px; }
.wt-week-col { display: flex; flex-direction: column; align-items: center; gap: 9px; }
.wt-week-letter { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--faint); position: relative; padding-bottom: 6px; }
.wt-week-letter-today { color: var(--text); }
.wt-week-letter-today::after { content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 10px; height: 1.5px; background: var(--accent); }
.wt-week-dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--faint); background: transparent; }

.wt-cta { width: 100%; background: var(--accent); color: var(--accent-ink); border: none; border-radius: 3px; padding: 15px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; margin: 4px 0 24px; }
.wt-cta:disabled { background: var(--surface-2); color: var(--faint); }
.wt-cta-finish { position: sticky; bottom: 82px; box-shadow: 0 8px 24px rgba(0,0,0,0.55); }
.wt-cta-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }

.wt-section-title { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 26px 0 4px; }

/* ---- flat list rows (Home / History / Templates) ---- */
.wt-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 15px 0; border-bottom: 1px solid var(--border); }
.wt-row:last-child { border-bottom: none; }
.wt-row-tag { width: 3px; align-self: stretch; border-radius: 2px; margin-inline-end: 11px; flex-shrink: 0; }
.wt-row-main { flex: 1; min-width: 0; }
.wt-row-title { font-size: 14.5px; font-weight: 500; }
.wt-row-meta { color: var(--dim); font-size: 12px; margin-top: 3px; }
.wt-row-value { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--dim); white-space: nowrap; }
.wt-row-btn { width: 100%; background: none; border: none; padding: 0; text-align: left; font-family: inherit; color: inherit; display: flex; align-items: center; cursor: pointer; }
.wt-list { margin-bottom: 4px; }
.wt-history-detail { padding: 4px 0 14px; display: flex; flex-direction: column; gap: 14px; }
.wt-history-exercise-name { font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.wt-confirm-text { font-size: 11px; color: var(--push); margin: 4px 0 12px; }

/* ---- exercise block during workout ---- */
.wt-exblock { border-top: 1px solid var(--border); padding: 18px 0; }
.wt-exblock:last-of-type { border-bottom: 1px solid var(--border); }
.wt-exblock-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.wt-exblock-title { font-size: 15px; font-weight: 500; }
.wt-target { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--dim); margin-top: 3px; }

.wt-chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.wt-chip { border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
.wt-chip-pr { border-color: var(--pr); color: var(--pr); }
.wt-chip-x { background: none; border: none; color: var(--faint); cursor: pointer; display: inline-flex; padding: 0; }

.wt-set-form { display: flex; gap: 6px; margin-top: 8px; }
.wt-input { flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 3px; padding: 10px 12px; font-size: 14px; min-width: 0; font-family: inherit; }
.wt-input-num { text-align: center; font-family: 'IBM Plex Mono', monospace; }
.wt-input-tiny { flex: 1; padding: 7px 6px; font-size: 12px; text-align: center; }
.wt-add-set-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 14px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.wt-duplicate-btn { margin-top: 10px; background: none; border: none; color: var(--dim); font-size: 11.5px; display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 0; }
.wt-best-hint { margin-top: 8px; font-size: 11px; color: var(--faint); }

.wt-quick-add-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.wt-quick-add-chip { background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 3px; padding: 6px 11px; font-size: 12px; cursor: pointer; }

.wt-tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.wt-tag { border: 1px solid var(--border); border-radius: 3px; padding: 5px 10px; font-size: 12px; color: var(--dim); }

.wt-add-exercise { border-top: 1px dashed var(--border); padding-top: 18px; margin-top: 4px; }
.wt-add-exercise-label { font-size: 12.5px; color: var(--dim); margin-bottom: 8px; }

.wt-row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.wt-icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.wt-icon-btn-quiet { width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent; color: var(--dim); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

.wt-option { width: 100%; background: none; border: 1px solid var(--border); border-radius: 3px; color: var(--text); padding: 16px; margin-bottom: 9px; font-size: 14.5px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; text-align: left; font-family: inherit; }
.wt-option-tag { width: 3px; align-self: stretch; border-radius: 2px; }

.wt-color-row { display: flex; gap: 12px; margin-bottom: 22px; }
.wt-color-dot { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border); cursor: pointer; padding: 0; }
.wt-color-dot-active { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--text); }

.wt-checklist { display: flex; flex-direction: column; margin-bottom: 18px; border-top: 1px solid var(--border); }
.wt-check-block { border-bottom: 1px solid var(--border); }
.wt-check-row { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: none; padding: 13px 2px; color: var(--text); font-size: 14px; cursor: pointer; text-align: left; font-family: inherit; }
.wt-checkbox { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; color: var(--accent-ink); flex-shrink: 0; }
.wt-checkbox-checked { border-color: var(--accent); background: var(--accent); }
.wt-target-inputs { display: flex; gap: 6px; padding: 0 2px 14px; }

.wt-links-row { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
.wt-text-link { background: none; border: none; color: var(--faint); font-size: 11.5px; cursor: pointer; padding: 0; font-family: inherit; border-bottom: 1px solid var(--faint); padding-bottom: 1px; }

.wt-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(13,13,12,0.92); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; padding: 10px 6px calc(8px + env(safe-area-inset-bottom)); }
.wt-nav-btn { flex: 1; background: none; border: none; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; padding: 4px 0; cursor: pointer; font-family: inherit; letter-spacing: 0.02em; }
.wt-nav-active { color: var(--accent); }
.wt-nav-icon { position: relative; display: flex; }
.wt-nav-dot { position: absolute; top: -1px; right: -3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

.wt-toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px 18px; border-radius: 3px; font-size: 12.5px; z-index: 20; }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="import-file-input" accept="application/json" style="display:none">
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "workout-app-data-v1";
  var DAY_COLORS = { push: "#B8574A", pull: "#4C7996", mix: "#876AA0" };

  var SEED_TEMPLATES = [
    { id: "push-day", name: "Push Day", color: "push", exercises: [
      { name: "Walking Lunges", targetSets: 3, repMin: 10, repMax: 12 },
      { name: "Flat Bench Press", targetSets: 4, repMin: 8, repMax: 10 },
      { name: "Machine Fly / Cables", targetSets: 3, repMin: 8, repMax: 10 },
      { name: "Seated Dumbbell Press", targetSets: 3, repMin: 8, repMax: 12 },
      { name: "Dips", targetSets: 3, repMin: 10, repMax: 15 },
      { name: "Abs", targetSets: 3, repMin: 10, repMax: 15, note: "×2" }
    ]},
    { id: "pull-day", name: "Pull Day", color: "pull", exercises: [
      { name: "Goblet Squat", targetSets: 3, repMin: 10, repMax: 12 },
      { name: "Pull-downs", targetSets: 3, repMin: 8, repMax: 12 },
      { name: "Machine Rows", targetSets: 3, repMin: 8, repMax: 12 },
      { name: "Face Pulls", targetSets: 3, repMin: 15, repMax: 20 },
      { name: "Biceps Curls", targetSets: 3, repMin: 10, repMax: 15 },
      { name: "Abs", targetSets: 3, repMin: 10, repMax: 15, note: "×2" }
    ]},
    { id: "mix-day", name: "Mix Day", color: "mix", exercises: [
      { name: "DB RDL", targetSets: 3, repMin: 6, repMax: 10 },
      { name: "Incline DB Press", targetSets: 3, repMin: 8, repMax: 12 },
      { name: "Bulgarian Split Squats", targetSets: 3, repMin: 10, repMax: 12 },
      { name: "Pull-Ups", targetSets: 3, repMin: 8, repMax: 12 },
      { name: "Lateral Raises", targetSets: 3, repMin: 15, repMax: 20 },
      { name: "Abs", targetSets: 3, repMin: 10, repMax: 15, note: "×2" }
    ]}
  ];
  var SEED_EXERCISES = Array.from(new Set(SEED_TEMPLATES.flatMap(function (t) { return t.exercises.map(function (e) { return e.name; }); })));
  var DEFAULT_DATA = { exercises: SEED_EXERCISES, templates: SEED_TEMPLATES, sessions: [], draft: null };

  // ---------- icons (hand-drawn, minimal, stroke = currentColor) ----------
  var ICON = {
    home: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V19a1 1 0 0 0 1 1h4v-6h3v6h4a1 1 0 0 0 1-1V9.5"/></svg>',
    workout: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="12" x2="22" y2="12"/><line x1="6.5" y1="7.5" x2="6.5" y2="16.5"/><line x1="17.5" y1="7.5" x2="17.5" y2="16.5"/><line x1="3" y1="9.5" x2="3" y2="14.5"/><line x1="21" y1="9.5" x2="21" y2="14.5"/></svg>',
    history: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.25"/><path d="M12 7.75V12l3.25 1.85"/></svg>',
    plans: '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5.25" y="3.75" width="13.5" height="16.5" rx="1.5"/><path d="M8.75 9h6.5M8.75 12.5h6.5M8.75 16h3.5"/></svg>',
    plus: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    close: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    trash: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9.5 7V5a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v2m-8.5 0 .9 12a1 1 0 0 0 1 .9h6.2a1 1 0 0 0 1-.9l.9-12"/></svg>',
    star: '<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor" stroke="none"><path d="M12 3.5l2.2 4.7 5 .65-3.65 3.5.9 5.15L12 15.1l-4.45 2.4.9-5.15L4.8 8.85l5-.65z"/></svg>',
    chevDown: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>',
    chevUp: '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14.5l6-6 6 6"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6"/></svg>',
    repeat: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2.5l3.5 3.5-3.5 3.5"/><path d="M3.5 10.5V9a4 4 0 0 1 4-4H20"/><path d="M7 21.5L3.5 18l3.5-3.5"/><path d="M20.5 13.5V15a4 4 0 0 1-4 4H4"/></svg>'
  };

  // ---------- state ----------
  var data = loadData();
  var view = "home";
  var resetArmed = false, resetTimer = null;
  var deleteArmedId = null, deleteTimer = null;
  var toastMsg = null, toastTimer = null;
  var historyOpenId = null;
  var editingTemplate = undefined;
  var templateRows = {};
  var templateName = "";
  var templateColor = null;

  function uid(p) { return p + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); }

  function loadData() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return Object.assign({}, DEFAULT_DATA, JSON.parse(raw));
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    catch (e) { showToast("Couldn't save — storage may be full"); }
  }

  function formatDateLong(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }
  function daysAgoText(iso) {
    var then = new Date(iso), now = new Date();
    var diff = Math.floor((new Date(now.toDateString()) - new Date(then.toDateString())) / 86400000);
    if (diff <= 0) return "Today";
    if (diff === 1) return "Yesterday";
    return diff + " days ago";
  }
  function sessionVolume(s) { return s.entries.reduce(function (sum, e) { return sum + e.sets.reduce(function (a, x) { return a + x.weight * x.reps; }, 0); }, 0); }
  function sessionSetCount(s) { return s.entries.reduce(function (sum, e) { return sum + e.sets.length; }, 0); }
  function bestWeightFor(name) {
    var best = 0;
    data.sessions.forEach(function (s) {
      s.entries.forEach(function (e) {
        if (e.exerciseName === name) e.sets.forEach(function (set) { if (set.weight > best) best = set.weight; });
      });
    });
    return best;
  }
  function targetText(entry) {
    if (!entry.target || !entry.target.sets) return null;
    var t = "Target " + entry.target.sets + " × " + entry.target.repMin + (entry.target.repMax && entry.target.repMax !== entry.target.repMin ? "–" + entry.target.repMax : "");
    if (entry.note) t += " (" + entry.note + ")";
    return t;
  }

  function showToast(msg) {
    toastMsg = msg;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastMsg = null; render(); }, 2200);
  }

  // ---------- small components ----------
  function ring(logged, target, color) {
    var size = 92, stroke = 5, r = (size - stroke) / 2, c = 2 * Math.PI * r;
    var frac = target > 0 ? Math.min(logged / target, 1) : (logged > 0 ? 1 : 0);
    var offset = c * (1 - frac);
    var strokeColor = color || "var(--accent)";
    return '<div class="wt-ring-wrap"><svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="var(--border)" stroke-width="' + stroke + '"/>' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + strokeColor + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"/>' +
      '</svg><div class="wt-ring-center"><span class="wt-ring-num">' + logged + '</span><span class="wt-ring-denom">' + (target > 0 ? "of " + target : "sets") + '</span></div></div>';
  }

  function weekStripHtml() {
    var today = new Date(), cols = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(today); d.setDate(today.getDate() - i);
      var match = data.sessions.find(function (s) { return new Date(s.date).toDateString() === d.toDateString(); });
      var isToday = d.toDateString() === today.toDateString();
      var dotStyle = match ? "background:" + (DAY_COLORS[match.dayColor] || "var(--dim)") + ";border-color:transparent;" : "";
      cols.push(
        '<div class="wt-week-col"><span class="wt-week-letter' + (isToday ? " wt-week-letter-today" : "") + '">' + d.toLocaleDateString("en-US", { weekday: "narrow" }) +
        '</span><span class="wt-week-dot" style="' + dotStyle + '"></span></div>'
      );
    }
    return '<div class="wt-week">' + cols.join("") + "</div>";
  }

  function chipsHtml(entryIdx, sets, readOnly) {
    return '<div class="wt-chip-row">' + sets.map(function (set, si) {
      return '<span class="wt-chip' + (set.isPR ? " wt-chip-pr" : "") + '">' + (set.isPR ? ICON.star + " " : "") +
        set.weight + "kg × " + set.reps +
        (readOnly ? "" : '<button class="wt-chip-x" data-action="delete-set" data-arg="' + entryIdx + ":" + si + '">' + ICON.close.replace('width="16" height="16"', 'width="10" height="10"') + '</button>') +
        '</span>';
    }).join("") + "</div>";
  }

  // ---------- screens ----------
  function renderHome() {
    var last = data.sessions[data.sessions.length - 1];
    var hour = new Date().getHours();
    var greeting = hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
    var weekSessions = data.sessions.filter(function (s) { return new Date() - new Date(s.date) <= 7 * 86400000; });
    var weekSets = weekSessions.reduce(function (sum, s) { return sum + sessionSetCount(s); }, 0);

    var recent = data.sessions.slice(-4).reverse().map(function (s) {
      var tagStyle = s.dayColor ? "background:" + DAY_COLORS[s.dayColor] : "background:var(--border)";
      return '<div class="wt-row"><span class="wt-row-tag" style="' + tagStyle + '"></span>' +
        '<div class="wt-row-main"><div class="wt-row-title">' + esc(s.templateName || "Freestyle") + '</div>' +
        '<div class="wt-row-meta">' + s.entries.length + ' exercises · ' + sessionSetCount(s) + ' sets</div></div>' +
        '<span class="wt-row-value">' + daysAgoText(s.date) + '</span></div>';
    }).join("");

    return '<div class="wt-screen">' +
      '<div class="wt-eyebrow">Training Log</div>' +
      '<h1 class="wt-display">' + greeting + '</h1>' +
      (last
        ? '<p class="wt-subtle">Last session ' + daysAgoText(last.date).toLowerCase() + ' · ' + sessionVolume(last).toLocaleString() + 'kg moved</p>'
        : '<p class="wt-subtle">No sessions logged yet.</p>') +
      '<div class="wt-ring-block">' + ring(weekSets, 0, "var(--accent)") +
      '<div class="wt-ring-caption">You\'ve logged <b>' + weekSets + ' sets</b> this week' + (weekSessions.length ? ' across <b>' + weekSessions.length + '</b> session' + (weekSessions.length > 1 ? 's' : '') : '') + '.</div></div>' +
      weekStripHtml() +
      '<button class="wt-cta" data-action="go-start-workout">' + ICON.workout + ' Start Workout</button>' +
      (data.sessions.length ? '<div class="wt-section-title">Recent</div><div class="wt-list">' + recent + '</div>' : '') +
      '<div class="wt-links-row">' +
      '<button class="wt-text-link" data-action="export-data">Export backup</button>' +
      '<button class="wt-text-link" data-action="import-data">Import backup</button>' +
      '<button class="wt-text-link" data-action="reset-data">' + (resetArmed ? "Confirm reset" : "Reset data") + '</button>' +
      '</div>' +
      '</div>';
  }

  function renderStartChoice() {
    var opts = data.templates.map(function (t) {
      return '<button class="wt-option" data-action="start-draft" data-arg="' + t.id + '">' +
        '<span class="wt-option-tag" style="background:' + (DAY_COLORS[t.color] || "var(--border)") + '"></span>' +
        '<span style="flex:1;margin-left:12px">' + esc(t.name) + '</span><span class="wt-dim wt-mono" style="font-size:11.5px">' + t.exercises.length + ' exercises</span></button>';
    }).join("");
    return '<div class="wt-screen">' +
      '<div class="wt-row-between"><h2 class="wt-h2">Choose a plan</h2><button class="wt-icon-btn" data-action="go-view" data-arg="home">' + ICON.close + '</button></div>' +
      '<button class="wt-option" data-action="start-draft" data-arg="freestyle"><span>Freestyle</span><span class="wt-dim">' + ICON.plus + '</span></button>' +
      opts +
      '</div>';
  }

  function renderWorkout() {
    var draft = data.draft;
    var usedNames = {};
    draft.entries.forEach(function (e) { usedNames[e.exerciseName] = true; });
    var available = data.exercises.filter(function (n) { return !usedNames[n]; });
    var totalSets = sessionSetCount(draft);
    var totalTarget = draft.entries.reduce(function (sum, e) { return sum + (e.target ? e.target.sets : 0); }, 0);
    var badgeColor = draft.dayColor ? DAY_COLORS[draft.dayColor] : "var(--accent)";

    var ringBlock = '<div class="wt-ring-block">' + ring(totalSets, totalTarget, badgeColor) +
      '<div class="wt-ring-caption">' + (totalTarget > 0
        ? '<b>' + totalSets + ' of ' + totalTarget + '</b> planned sets logged.'
        : (totalSets > 0 ? '<b>' + totalSets + '</b> sets logged so far.' : 'No sets logged yet.')) + '</div></div>';

    var blocks = draft.entries.map(function (entry, idx) {
      var t = targetText(entry);
      var best = bestWeightFor(entry.exerciseName);
      return '<div class="wt-exblock">' +
        '<div class="wt-exblock-head"><div><div class="wt-exblock-title">' + esc(entry.exerciseName) + '</div>' +
        (t ? '<div class="wt-target">' + esc(t) + '</div>' : '') + '</div>' +
        '<button class="wt-icon-btn-quiet" data-action="remove-exercise" data-arg="' + idx + '">' + ICON.trash + '</button></div>' +
        (entry.sets.length ? chipsHtml(idx, entry.sets, false) : '') +
        '<div class="wt-set-form">' +
        '<input class="wt-input wt-input-num" type="number" inputmode="decimal" placeholder="kg" id="w-input-' + idx + '">' +
        '<input class="wt-input wt-input-num" type="number" inputmode="numeric" placeholder="reps" id="r-input-' + idx + '">' +
        '<button class="wt-add-set-btn" data-action="add-set" data-arg="' + idx + '">' + ICON.plus + ' Add</button>' +
        '</div>' +
        (entry.sets.length ? '<button class="wt-duplicate-btn" data-action="duplicate-set" data-arg="' + idx + '">' + ICON.repeat + ' Repeat last set</button>' : '') +
        (best > 0 ? '<div class="wt-best-hint">Best so far — ' + best + 'kg</div>' : '') +
        '</div>';
    }).join("");

    var quickChips = available.slice(0, 6).map(function (n) {
      return '<button class="wt-quick-add-chip" data-action="quick-add-exercise" data-arg="' + esc(n) + '">' + esc(n) + '</button>';
    }).join("");

    return '<div class="wt-screen">' +
      '<div class="wt-row-between"><div><div class="wt-eyebrow" style="color:' + badgeColor + '">' + esc(draft.templateName || "Freestyle") +
      '</div><h2 class="wt-h2">' + formatDateLong(draft.date) + '</h2></div>' +
      '<button class="wt-icon-btn" data-action="cancel-workout">' + ICON.close + '</button></div>' +
      ringBlock + blocks +
      '<div class="wt-add-exercise"><div class="wt-add-exercise-label">Add exercise</div>' +
      '<div class="wt-set-form"><input class="wt-input" list="exercise-options" placeholder="Exercise name" id="new-exercise-input">' +
      '<datalist id="exercise-options">' + available.map(function (n) { return '<option value="' + esc(n) + '">'; }).join("") + '</datalist>' +
      '<button class="wt-add-set-btn" data-action="add-exercise">' + ICON.plus + ' Add</button></div>' +
      (available.length ? '<div class="wt-quick-add-row">' + quickChips + '</div>' : '') +
      '</div>' +
      '<button class="wt-cta wt-cta-finish"' + (totalSets === 0 ? " disabled" : "") + ' data-action="finish-workout">' + ICON.check + ' Finish Workout</button>' +
      '</div>';
  }

  function renderHistory() {
    var ordered = data.sessions.slice().reverse();
    if (!ordered.length) {
      return '<div class="wt-screen"><h2 class="wt-h2">History</h2><p class="wt-subtle" style="margin-top:14px">No sessions saved yet. Everything you finish will show up here.</p></div>';
    }
    var items = ordered.map(function (s) {
      var open = historyOpenId === s.id;
      var tagStyle = s.dayColor ? "background:" + DAY_COLORS[s.dayColor] : "background:var(--border)";
      var detail = open ? '<div class="wt-history-detail">' + s.entries.map(function (e) {
        return '<div><div class="wt-history-exercise-name">' + esc(e.exerciseName) + '</div>' + chipsHtml(0, e.sets, true) + '</div>';
      }).join("") + '</div>' : '';
      return '<div><button class="wt-row-btn wt-row" data-action="toggle-history" data-arg="' + s.id + '">' +
        '<span class="wt-row-tag" style="' + tagStyle + '"></span>' +
        '<div class="wt-row-main"><div class="wt-row-title">' + esc(s.templateName || "Freestyle") + '</div><div class="wt-row-meta">' + formatDateLong(s.date) + '</div></div>' +
        '<span class="wt-row-value" style="display:flex;align-items:center;gap:8px">' + sessionSetCount(s) + ' sets · ' + sessionVolume(s).toLocaleString() + 'kg ' + (open ? ICON.chevUp : ICON.chevDown) + '</span>' +
        '</button>' + detail + '</div>';
    }).join("");
    return '<div class="wt-screen"><h2 class="wt-h2">History</h2><div class="wt-list" style="margin-top:14px">' + items + '</div></div>';
  }

  function renderTemplates() {
    if (editingTemplate !== undefined) return renderTemplateEditor();
    var items = data.templates.map(function (t) {
      var tagStyle = t.color ? "background:" + DAY_COLORS[t.color] : "background:var(--border)";
      return '<div class="wt-row"><span class="wt-row-tag" style="' + tagStyle + '"></span>' +
        '<div class="wt-row-main"><div class="wt-row-title">' + esc(t.name) + '</div>' +
        '<div class="wt-row-meta">' + t.exercises.map(function (e) { return esc(e.name); }).join(" · ") + '</div>' +
        (deleteArmedId === t.id ? '<div class="wt-confirm-text">Tap delete again to confirm</div>' : '') + '</div>' +
        '<div style="display:flex;gap:4px"><button class="wt-icon-btn-quiet" data-action="edit-template" data-arg="' + t.id + '">' + ICON.plans + '</button>' +
        '<button class="wt-icon-btn-quiet" data-action="delete-template" data-arg="' + t.id + '" style="' + (deleteArmedId === t.id ? "color:var(--push)" : "") + '">' + ICON.trash + '</button></div></div>';
    }).join("");
    var tags = data.exercises.map(function (n) { return '<span class="wt-tag">' + esc(n) + '</span>'; }).join("");
    return '<div class="wt-screen"><div class="wt-row-between"><h2 class="wt-h2">Plans</h2>' +
      '<button class="wt-icon-btn" data-action="edit-template" data-arg="new">' + ICON.plus + '</button></div>' +
      '<div class="wt-list">' + items + '</div>' +
      '<div class="wt-section-title">Exercise library</div><div class="wt-tag-row">' + tags + '</div></div>';
  }

  function renderTemplateEditor() {
    var checklist = data.exercises.map(function (n) {
      var row = templateRows[n];
      var checked = row && row.checked;
      var inputs = checked ? '<div class="wt-target-inputs">' +
        '<input class="wt-input wt-input-tiny" type="number" placeholder="Sets" value="' + (row.targetSets || "") + '" data-name="' + esc(n) + '" data-field="targetSets">' +
        '<input class="wt-input wt-input-tiny" type="number" placeholder="Min reps" value="' + (row.repMin || "") + '" data-name="' + esc(n) + '" data-field="repMin">' +
        '<input class="wt-input wt-input-tiny" type="number" placeholder="Max reps" value="' + (row.repMax || "") + '" data-name="' + esc(n) + '" data-field="repMax">' +
        '</div>' : '';
      return '<div class="wt-check-block">' +
        '<button class="wt-check-row" data-action="toggle-template-exercise" data-arg="' + esc(n) + '">' +
        '<span class="wt-checkbox' + (checked ? " wt-checkbox-checked" : "") + '">' + (checked ? ICON.check : "") + '</span>' + esc(n) + '</button>' + inputs + '</div>';
    }).join("");

    var colorDots = '<button class="wt-color-dot' + (templateColor === null ? " wt-color-dot-active" : "") +
      '" style="background:var(--surface-2)" data-action="set-template-color" data-arg="none"></button>' +
      Object.keys(DAY_COLORS).map(function (key) {
        return '<button class="wt-color-dot' + (templateColor === key ? " wt-color-dot-active" : "") + '" style="background:' + DAY_COLORS[key] + '" data-action="set-template-color" data-arg="' + key + '"></button>';
      }).join("");

    return '<div class="wt-screen">' +
      '<div class="wt-row-between"><h2 class="wt-h2">' + (editingTemplate ? "Edit Plan" : "New Plan") + '</h2>' +
      '<button class="wt-icon-btn" data-action="cancel-template-edit">' + ICON.close + '</button></div>' +
      '<input class="wt-input" placeholder="Plan name" id="template-name-input" value="' + esc(templateName) + '">' +
      '<div class="wt-section-title">Color tag</div><div class="wt-color-row">' + colorDots + '</div>' +
      '<div class="wt-section-title">Exercises</div><div class="wt-checklist">' + checklist + '</div>' +
      '<div class="wt-set-form"><input class="wt-input" placeholder="New exercise" id="new-template-exercise-input">' +
      '<button class="wt-add-set-btn" data-action="add-template-exercise">' + ICON.plus + ' Add</button></div>' +
      '<button class="wt-cta" style="margin-top:24px" data-action="save-template">Save Plan</button>' +
      '</div>';
  }

  function renderNav() {
    var items = [
      { key: "home", label: "Home", icon: ICON.home },
      { key: "workout", label: "Workout", icon: ICON.workout },
      { key: "history", label: "History", icon: ICON.history },
      { key: "templates", label: "Plans", icon: ICON.plans }
    ];
    return '<div class="wt-nav">' + items.map(function (it) {
      var active = view === it.key;
      var dot = it.key === "workout" && data.draft ? '<span class="wt-nav-dot"></span>' : "";
      return '<button class="wt-nav-btn' + (active ? " wt-nav-active" : "") + '" data-action="go-view" data-arg="' + it.key + '">' +
        '<span class="wt-nav-icon">' + it.icon + dot + '</span><span>' + it.label + '</span></button>';
    }).join("") + '</div>';
  }

  // ---------- main render ----------
  function render() {
    var html = "";
    if (view === "home") html = renderHome();
    else if (view === "workout") html = data.draft ? renderWorkout() : renderStartChoice();
    else if (view === "history") html = renderHistory();
    else if (view === "templates") html = renderTemplates();
    html += renderNav();
    if (toastMsg) html += '<div class="wt-toast">' + esc(toastMsg) + '</div>';
    document.getElementById("app").innerHTML = html;
  }

  // ---------- actions ----------
  function goStartWorkout() { view = "workout"; render(); }

  function startDraft(arg) {
    var template = arg === "freestyle" ? null : data.templates.find(function (t) { return t.id === arg; });
    data.draft = {
      id: uid("sess"),
      date: new Date().toISOString(),
      templateId: template ? template.id : null,
      templateName: template ? template.name : null,
      dayColor: template ? template.color : null,
      entries: template ? template.exercises.map(function (e) {
        return { exerciseName: e.name, sets: [], note: e.note || null,
          target: e.targetSets ? { sets: e.targetSets, repMin: e.repMin, repMax: e.repMax } : null };
      }) : []
    };
    saveData(); render();
  }
  function cancelWorkout() { data.draft = null; saveData(); view = "home"; render(); }
  function finishWorkout() {
    if (sessionSetCount(data.draft) === 0) return;
    data.sessions.push(data.draft);
    data.draft = null;
    saveData();
    view = "history";
    showToast("Workout saved");
  }
  function addExercise(name) {
    var trimmed = (name || "").trim();
    if (!trimmed) return;
    data.draft.entries.push({ exerciseName: trimmed, sets: [], target: null, note: null });
    if (data.exercises.indexOf(trimmed) === -1) data.exercises.push(trimmed);
    saveData(); render();
  }
  function addSet(idx) {
    var w = parseFloat(document.getElementById("w-input-" + idx).value);
    var r = parseInt(document.getElementById("r-input-" + idx).value, 10);
    if (!w || !r) return;
    var entry = data.draft.entries[idx];
    var best = bestWeightFor(entry.exerciseName);
    entry.sets.push({ weight: w, reps: r, isPR: best > 0 && w > best });
    saveData(); render();
  }
  function duplicateSet(idx) {
    var entry = data.draft.entries[idx];
    var last = entry.sets[entry.sets.length - 1];
    if (!last) return;
    var best = bestWeightFor(entry.exerciseName);
    entry.sets.push({ weight: last.weight, reps: last.reps, isPR: best > 0 && last.weight > best });
    saveData(); render();
  }
  function deleteSet(arg) {
    var parts = arg.split(":"); var idx = +parts[0], si = +parts[1];
    data.draft.entries[idx].sets.splice(si, 1);
    saveData(); render();
  }
  function removeExercise(idx) { data.draft.entries.splice(idx, 1); saveData(); render(); }

  function armReset() {
    if (resetArmed) {
      clearTimeout(resetTimer); resetArmed = false;
      data = JSON.parse(JSON.stringify(DEFAULT_DATA));
      saveData(); view = "home"; showToast("Everything reset");
    } else {
      resetArmed = true; render();
      resetTimer = setTimeout(function () { resetArmed = false; render(); }, 3000);
    }
  }
  function armDeleteTemplate(id) {
    if (deleteArmedId === id) {
      clearTimeout(deleteTimer); deleteArmedId = null;
      data.templates = data.templates.filter(function (t) { return t.id !== id; });
      saveData(); render();
    } else {
      deleteArmedId = id; render();
      deleteTimer = setTimeout(function () { deleteArmedId = null; render(); }, 3000);
    }
  }

  function openTemplateEditor(arg) {
    if (arg === "new") {
      editingTemplate = null; templateName = ""; templateColor = null; templateRows = {};
    } else {
      var t = data.templates.find(function (x) { return x.id === arg; });
      editingTemplate = t; templateName = t.name; templateColor = t.color || null;
      templateRows = {};
      t.exercises.forEach(function (e) {
        templateRows[e.name] = { checked: true, targetSets: e.targetSets || "", repMin: e.repMin || "", repMax: e.repMax || "", note: e.note || "" };
      });
    }
    render();
  }
  function toggleTemplateExercise(name) {
    var existing = templateRows[name] || { targetSets: "", repMin: "", repMax: "", note: "" };
    templateRows[name] = Object.assign({}, existing, { checked: !existing.checked });
    render();
  }
  function addTemplateExercise() {
    var input = document.getElementById("new-template-exercise-input");
    var trimmed = input.value.trim();
    if (!trimmed) return;
    if (data.exercises.indexOf(trimmed) === -1) data.exercises.push(trimmed);
    templateRows[trimmed] = { checked: true, targetSets: "", repMin: "", repMax: "", note: "" };
    saveData(); render();
  }
  function saveTemplate() {
    var name = document.getElementById("template-name-input").value.trim();
    if (!name) { showToast("Give the plan a name first"); return; }
    var exercises = Object.keys(templateRows).filter(function (n) { return templateRows[n].checked; }).map(function (n) {
      var row = templateRows[n];
      return {
        name: n,
        targetSets: row.targetSets ? parseInt(row.targetSets, 10) : undefined,
        repMin: row.repMin ? parseInt(row.repMin, 10) : undefined,
        repMax: row.repMax ? parseInt(row.repMax, 10) : undefined,
        note: row.note || undefined
      };
    });
    if (!exercises.length) { showToast("Pick at least one exercise"); return; }
    var tpl = { id: editingTemplate ? editingTemplate.id : uid("tpl"), name: name, color: templateColor, exercises: exercises };
    var exists = data.templates.some(function (t) { return t.id === tpl.id; });
    data.templates = exists ? data.templates.map(function (t) { return t.id === tpl.id ? tpl : t; }) : data.templates.concat([tpl]);
    saveData();
    editingTemplate = undefined;
    showToast("Plan saved");
  }

  function exportData() {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "training-log-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Backup downloaded");
  }
  function importData() { document.getElementById("import-file-input").click(); }

  // ---------- event wiring ----------
  document.getElementById("import-file-input").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(reader.result);
        data = Object.assign({}, DEFAULT_DATA, parsed);
        saveData();
        showToast("Backup restored");
        view = "home"; render();
      } catch (err) { showToast("That file couldn't be read"); }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  document.getElementById("app").addEventListener("click", function (e) {
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var action = el.dataset.action, arg = el.dataset.arg;
    if (action === "go-view") { view = arg; render(); }
    else if (action === "go-start-workout") goStartWorkout();
    else if (action === "start-draft") startDraft(arg);
    else if (action === "cancel-workout") cancelWorkout();
    else if (action === "finish-workout") finishWorkout();
    else if (action === "add-set") addSet(+arg);
    else if (action === "duplicate-set") duplicateSet(+arg);
    else if (action === "delete-set") deleteSet(arg);
    else if (action === "remove-exercise") removeExercise(+arg);
    else if (action === "add-exercise") addExercise(document.getElementById("new-exercise-input").value);
    else if (action === "quick-add-exercise") addExercise(arg);
    else if (action === "reset-data") armReset();
    else if (action === "export-data") exportData();
    else if (action === "import-data") importData();
    else if (action === "edit-template") openTemplateEditor(arg);
    else if (action === "cancel-template-edit") { editingTemplate = undefined; render(); }
    else if (action === "toggle-template-exercise") toggleTemplateExercise(arg);
    else if (action === "set-template-color") { templateColor = arg === "none" ? null : arg; render(); }
    else if (action === "add-template-exercise") addTemplateExercise();
    else if (action === "save-template") saveTemplate();
    else if (action === "delete-template") armDeleteTemplate(arg);
    else if (action === "toggle-history") { historyOpenId = historyOpenId === arg ? null : arg; render(); }
  });

  document.getElementById("app").addEventListener("input", function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.field && el.dataset.name != null) {
      var row = templateRows[el.dataset.name] || {};
      row[el.dataset.field] = el.value;
      templateRows[el.dataset.name] = row;
    }
  });

  document.getElementById("app").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "new-exercise-input") addExercise(e.target.value);
    if (e.target.id === "new-template-exercise-input") addTemplateExercise();
  });

  render();
})();
</script>
</body>
</html>
